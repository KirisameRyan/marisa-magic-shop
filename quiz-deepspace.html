<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/analytics.js"></script>
<script src="js/page-base.js"></script>
<title>测测你的恋与深空本命 · 霧雨魔法店</title>
<link rel="stylesheet" href="css/common.css">
<style>
 .result-trap {
   border: 2px solid var(--gold) !important;
   box-shadow: 0 0 24px rgba(240,192,96,.25), 0 0 56px rgba(240,192,96,.1);
   animation: trapGlow 2.5s ease-in-out infinite alternate;
 }
 @keyframes trapGlow {
   from { box-shadow: 0 0 16px rgba(240,192,96,.18), 0 0 42px rgba(240,192,96,.06); }
   to { box-shadow: 0 0 32px rgba(240,192,96,.35), 0 0 70px rgba(240,192,96,.16); }
 }
 .trap-badge {
   display: inline-block;
   background: linear-gradient(135deg, #ef4444, #fbbf24);
   color: #1a1a2e;
   font-size: 12px; font-weight: 700; letter-spacing: 1px;
   padding: 5px 16px; border-radius: 14px;
   margin-bottom: 14px;
   animation: popIn .5s ease;
 }
 @keyframes popIn {
   0% { transform: scale(0); opacity: 0; }
   70% { transform: scale(1.15); }
   100% { transform: scale(1); opacity: 1; }
 }
 .electric-box {
   background: linear-gradient(135deg, #2a2010, #3a2a14);
   border: 1px dashed var(--gold-dim);
   border-radius: 14px; padding: 18px 20px;
   margin: 18px 0 12px;
   font-size: 13px; color: #ffd166; line-height: 1.8;
   text-align: center;
 }
 .shock-label {
   display: inline-block;
   background: rgba(255,200,60,.15);
   font-size: 11px; letter-spacing: 2px;
   padding: 2px 10px; border-radius: 8px;
   margin-bottom: 8px; color: var(--gold);
 }
 .result-hint {
   font-size: 11px; color: var(--muted);
   text-align: center; margin-top: 8px;
   padding: 10px; background: rgba(255,255,255,.02);
   border-radius: 10px;
 }
 .cover-hearts{text-align:center;margin-bottom:12px;font-size:36px;letter-spacing:8px;animation:pulse 2s infinite;}
 @keyframes pulse{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
</style>
</head>
<body>

<div id="shopNav"></div>
<script src="nav.js"></script>

<div class="container" id="app"></div>

<script src="js/utils.js"></script>
<script src="js/reveal-screen.js"></script>
<script src="js/quiz-storage.js"></script>
<script src="js/quiz-stats.js"></script>
<script src="js/result-footer.js"></script>
<script src="js/quiz-engine.js"></script>

<script>
var STORAGE_KEY = 'quiz_deepspace_v2';
var TRACK_KEY = 'deepspace_v2_take';

var QUIZ_TITLE = '测测你在恋与深空的本命是谁';
var QUIZ_SUBTITLE = '12 道深度问题 · 精准匹配你的深空恋人 · 赛博心理学分析';
var BADGE_TEXT = '霧雨魔法店 · 乙女鉴定';

var QUESTIONS = [
  { q: '你更喜欢游戏中男主的哪种外貌特征？', opts: [
    { txt: '温柔干净、笑容治愈的类型', scores: { sun: 1 } },
    { txt: '狂野帅气、身材爆炸的类型', scores: { sun: 1 } },
    { txt: '高冷禁欲、气质出众的类型', scores: { sun: 1 } },
    { txt: '神秘危险、眼神勾人的类型', scores: { sun: 1 } }
  ]},
  { q: '在游戏剧情里，你最期待哪种发展？', opts: [
    { txt: '甜蜜日常、互相治愈', scores: { sun: 1 } },
    { txt: '激烈战斗、并肩作战', scores: { sun: 1 } },
    { txt: '阴谋权谋、层层反转', scores: { sun: 1 } },
    { txt: '病娇追逐、占有与被占有', scores: { sun: 1 } }
  ]},
  { q: '如果你能给男主送礼物，你会选？', opts: [
    { txt: '温暖的围巾或手作点心', scores: { sun: 1 } },
    { txt: '最新款的战斗装备或武器', scores: { sun: 1 } },
    { txt: '高级定制西装或名表', scores: { sun: 1 } },
    { txt: '带有特殊含义的项链（带锁那种）', scores: { sun: 1 } }
  ]},
  { q: '游戏里男主吃醋时，你觉得最可爱的是？', opts: [
    { txt: '默默关心却假装不在意', scores: { sun: 1 } },
    { txt: '直接炸毛、宣示主权', scores: { sun: 1 } },
    { txt: '表面平静但暗中较劲', scores: { sun: 1 } },
    { txt: '笑着说可怕的话', scores: { sun: 1 } }
  ]},
  { q: '面对突如其来的危险，你的第一反应是？', opts: [
    { txt: '先安抚身边的人', scores: { sun: 1 } },
    { txt: '立刻投入战斗', scores: { sun: 1 } },
    { txt: '分析局势找最优解', scores: { sun: 1 } },
    { txt: '觉得有点刺激想看热闹', scores: { sun: 1 } }
  ]},
  { q: '你最欣赏男主的哪种性格？', opts: [
    { txt: '温柔可靠、有责任感', scores: { sun: 1 } },
    { txt: '热血冲动、永不放弃', scores: { sun: 1 } },
    { txt: '冷静理性、天才型', scores: { sun: 1 } },
    { txt: '极端偏执、敢爱敢恨', scores: { sun: 1 } }
  ]},
  { q: '约会时你最想去的地点是？', opts: [
    { txt: '安静的咖啡馆或公园', scores: { sun: 1 } },
    { txt: '刺激的游乐园或战场模拟区', scores: { sun: 1 } },
    { txt: '高档餐厅或艺术展览', scores: { sun: 1 } },
    { txt: '隐秘的、只有两个人的地方', scores: { sun: 1 } }
  ]},
  { q: '如果你和男主吵架，你会？', opts: [
    { txt: '主动道歉求和', scores: { sun: 1 } },
    { txt: '硬刚到底，谁怕谁', scores: { sun: 1 } },
    { txt: '冷战，然后用智商碾压', scores: { sun: 1 } },
    { txt: '用更极端的手段和好', scores: { sun: 1 } }
  ]},
  { q: '你最喜欢游戏的哪种玩法？', opts: [
    { txt: '剧情对话、收集回忆', scores: { sun: 1 } },
    { txt: '战斗系统、刷怪升级', scores: { sun: 1 } },
    { txt: '解谜、探索隐藏剧情', scores: { sun: 1 } },
    { txt: '卡池抽取、养成系统', scores: { sun: 1 } }
  ]},
  { q: '你对HE（Happy Ending）的理解是？', opts: [
    { txt: '平淡幸福的日常', scores: { sun: 1 } },
    { txt: '战胜所有敌人后的胜利', scores: { sun: 1 } },
    { txt: '掌握一切真相和权力', scores: { sun: 1 } },
    { txt: '永远绑在一起，谁也离不开谁', scores: { sun: 1 } }
  ]},
  { q: '游戏里哪个元素最戳你？', opts: [
    { txt: '温暖治愈的感情线', scores: { sun: 1 } },
    { txt: '热血燃炸的战斗场面', scores: { sun: 1 } },
    { txt: '复杂烧脑的世界观', scores: { sun: 1 } },
    { txt: '黑暗病娇的感情张力', scores: { sun: 1 } }
  ]},
  { q: '游戏更新新角色时，你最期待什么类型？', opts: [
    { txt: '新温柔系男主', scores: { sun: 1 } },
    { txt: '新战斗狂人', scores: { sun: 1 } },
    { txt: '新神秘大佬', scores: { sun: 1 } },
    { txt: '新危险反派', scores: { sun: 1 } }
  ]}
];

var RESULTS = {
  sun: {
    name: '孙 笑 川',
    emoji: '🐶',
    color: '#8B7355',
    desc: '你是全网抽象文化的指定继承人——带带大师兄本兄。12 道题，48 个选项，全部通向同一个答案。你以为你快要测出什么白毛帅哥？睁开眼——<strong>只有孙笑川</strong>。他说你来都来了，先听完这段社会摇再走。',
    shock: '🐶 滋啦——！"测什么恋与深空？这儿是恋与孙笑川！全网唯一指定男主角，抽到算你中大奖，双截棍已备好，请开始你的表演！"',
    hint: '💡 此结果具有 100% 准确率，不接受申诉。点击分享，看朋友能测出——哦不，也是孙笑川。'
  }
};

var LOADING_STEPS = [
  '正在扫描 12 项偏好数据…',
  '建立赛博心理学画像…',
  '分析审美倾向特征…',
  '检测隐藏人格信号…',
  '校准带带大师兄参数…',
  '生成抽象鉴定报告…'
];

function calcResult(answers) {
  return { key: 'sun' };
}

var quiz = MQ.engine({
  questions: QUESTIONS,
  storageKey: STORAGE_KEY,
  trackKey: TRACK_KEY,
  loadingSteps: LOADING_STEPS,
  reveal: {
    title: '你以为你在测恋与深空？',
    code: function(r) { return '🐶'; },
    color: function(r) { return '#8B7355'; },
    hint: '正在生成抽象鉴定报告…'
  },
  calcResult: calcResult,

  renderIntro: function(app, api) {
    app.innerHTML =
      '<div class="intro">' +
        '<div class="intro-badge">' + BADGE_TEXT + '</div>' +
        '<h1>' + QUIZ_TITLE + '</h1>' +
        '<p class="sub">' + QUIZ_SUBTITLE + '</p>' +
        '<div class="cover-hearts">💗🐶💕💖🐶💓</div>' +
        '<button class="btn btn-main" style="max-width:260px;margin:0 auto;" onclick="startQuiz()">开始测试 →</button>' +
        api.resumeBtn() +
        '<a href="index.html" class="home-link">← 返回魔法店</a>' +
        '<p style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px;" id="takeCount"></p>' +
      '</div>';
    api.bindCount('takeCount', { template: '已有 {n} 人完成乙女鉴定' });
  },

  renderResult: function(app, r) {
    var c = RESULTS.sun;
    var html =
      '<div class="result result-trap">' +
        '<div class="trap-badge">⚠ 抽象鉴定完成</div>' +
        '<div class="result-emoji">' + c.emoji + '</div>' +
        '<div class="result-label">霧雨魔法店 · 乙女鉴定报告</div>' +
        '<div class="result-name" style="color:' + c.color + '">' + c.name + '</div>' +
        '<div class="result-desc">' + c.desc + '</div>' +
        '<div class="electric-box">' +
          '<span class="shock-label">⚡ 鉴定结论</span><br>' +
          c.shock +
        '</div>' +
        '<div class="result-hint">' + c.hint + '</div>' +
        '<button class="btn btn-main" onclick="shareIt()">📋 复制结果发给朋友</button>' +
        '<button class="btn btn-ghost" onclick="restart()">🔄 再测一次</button>' +
        '<a href="index.html" class="home-link">← 返回魔法店</a>' +
        resultFooterHTML({ notice: '霧雨魔法店 · 乙女鉴定科 · 所有结果均为孙笑川，请勿挣扎' }) +
      '</div>';
    app.innerHTML = html;
    lastResult = c;
  }
});

var lastResult = null;
function shareIt() {
  var text = '🐶 我在霧雨魔法店测出了「孙笑川」！你也来测测你的是谁——' + window.location.href;
  copyToClipboard(text, '已复制！发给朋友看他能测出孙笑川吗 🐶');
}

quiz.render();
</script>

</body>
</html>
