<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>导出初始化行情</title><h1>导出初始化行情</h1><p>仅导出旧预览的股票和ETF行情，不包含账户、资金、持仓、订单或登录凭据。</p><button id="export">导出行情</button><p id="result"></p><script>
document.getElementById('export').onclick=()=>{try{const old=JSON.parse(localStorage.getItem('gensokyo-exchange-practice-v1'));if(!old?.assets?.length)throw Error('未找到旧预览行情');const fields=['t','o','h','l','c','v','resolution','iopv'];const assets=old.assets.map(a=>({id:a.id,fair:a.fair,mark:a.mark,history:a.history.map(b=>Object.fromEntries(fields.filter(k=>Number.isFinite(b[k])).map(k=>[k,b[k]])))}));const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,end:old.lastTick,assets})],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='gensokyo-initial-market.json';a.click();URL.revokeObjectURL(url);document.getElementById('result').textContent='已导出 '+assets.length+' 个标的';}catch(e){document.getElementById('result').textContent=e.message;}};
</script></html>
