<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>魔理沙幸存者 · 霧雨魔法店</title>
<script src="js/analytics.js"></script>
<script src="js/page-base.js"></script>
<link rel="stylesheet" href="css/common.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1520;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden;height:100vh;}
.game-container{display:flex;flex-direction:column;align-items:center;width:100%;height:calc(100vh - 48px);background:#1a1520;overflow:hidden;}
.canvas-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;position:relative;min-height:0;}
canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:960/540;image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid #3a3045;border-radius:12px;}
.hud{position:absolute;top:14px;left:20px;right:20px;z-index:5;display:flex;justify-content:space-between;align-items:center;color:#8a7e9a;font-size:14px;flex-wrap:wrap;gap:4px;pointer-events:none;}
.hud strong{color:#f0c060;font-weight:800;letter-spacing:1px;}
.hud .lvl-badge{font-size:12px;color:#8fd8ff;margin-left:10px;font-weight:700;}
.hud .scoreboard{text-align:right;}
.hud .scoreboard span{display:inline-block;margin-left:12px;font-size:15px;color:#e0d8ec;font-weight:700;}
.hud .scoreboard .bestscore{color:#8a7e9a;font-size:12px;font-weight:400;}
.bars{position:absolute;top:42px;left:20px;right:20px;z-index:5;pointer-events:none;}
.bar{height:8px;border-radius:4px;background:rgba(58,48,69,.55);margin-bottom:5px;overflow:hidden;border:1px solid rgba(58,48,69,.8);}
.bar>div{height:100%;border-radius:4px;transition:width .12s;}
.bar.hp{height:14px;position:relative;}
#hpFill{background:linear-gradient(90deg,#ef4444,#f0c060);width:100%;}
#hpText{position:absolute;inset:0;font-size:9px;line-height:14px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.85);letter-spacing:1px;z-index:2;}
.bar.hp.low{animation:lowhp .55s infinite alternate;}
@keyframes lowhp{from{box-shadow:0 0 0 rgba(239,68,68,0)}to{box-shadow:0 0 14px rgba(239,68,68,.95)}}
#xpFill{background:linear-gradient(90deg,#8fd8ff,#b89fff);width:0%;}
#bossBar{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:60%;max-width:560px;z-index:6;pointer-events:none;text-align:center;}
#bossBar.hide{display:none;}
#bossName{font-size:12px;color:#ef4444;font-weight:800;letter-spacing:1px;text-shadow:0 1px 3px #000;}
.boss-track{height:10px;border:1px solid rgba(239,68,68,.6);border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:2px;}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#7f1d1d,#ef4444);transition:width .12s;}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,21,32,.92);z-index:10;border-radius:12px;overflow-y:auto;padding:20px;}
.overlay h1{font-size:28px;color:#f0c060;margin-bottom:8px;}
.overlay p{font-size:13px;color:#8a7e9a;text-align:center;line-height:1.8;margin-bottom:16px;max-width:460px;}
.overlay .btn-start{font-size:18px;font-weight:800;padding:14px 48px;border-radius:16px;border:none;background:linear-gradient(135deg,#f0c060,#e8a830);color:#1a1520;cursor:pointer;letter-spacing:2px;transition:transform .15s;margin-bottom:8px;}
.overlay .btn-start:hover{transform:scale(1.05);}
.overlay .btn-start:active{transform:scale(.95);}
.overlay.hide{display:none;}
.loading-text{color:#8a7e9a;font-size:14px;letter-spacing:1px;animation:pulse 1s infinite alternate;text-align:center;padding:40px 0;}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
/* 升级三选一 */
.lv-cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;max-width:660px;margin-bottom:8px;}
.lv-card{width:180px;background:#241e2a;border:2px solid #3a3045;border-radius:16px;padding:16px 12px 14px;cursor:pointer;text-align:center;transition:all .15s;position:relative;}
.lv-card:hover{border-color:#f0c060;transform:translateY(-4px);box-shadow:0 8px 24px rgba(240,192,96,.12);}
.lv-icon{font-size:34px;}
.lv-name{font-size:15px;font-weight:800;color:#e0d8ec;margin-top:6px;}
.lv-jp{font-size:10px;color:#8a7e9a;margin-top:2px;}
.lv-pips{color:#f0c060;font-size:11px;letter-spacing:2px;margin-top:5px;}
.lv-desc{font-size:12px;color:#b8acc8;margin-top:7px;line-height:1.5;}
.lv-key{position:absolute;top:8px;right:10px;font-size:11px;color:#8a7e9a;border:1px solid #3a3045;border-radius:6px;padding:1px 6px;}
/* 排行榜 */
#lbArea{margin-top:12px;width:100%;max-width:380px;}
#lbArea.hide{display:none;}
.lb-wrap{text-align:center;}
.lb-submit{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;}
.lb-input{background:#241e2a;border:1px solid #3a3045;border-radius:10px;padding:8px 14px;color:#e0d8ec;font-size:13px;width:140px;outline:none;font-family:inherit;}
.lb-input:focus{border-color:#f0c060;}
.lb-btn{background:linear-gradient(135deg,#f0c060,#e8a830);border:none;border-radius:10px;padding:8px 20px;color:#1a1520;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
.lb-btn:disabled{opacity:.5;cursor:default;}
.lb-btn-ghost{background:transparent;border:1px solid #3a3045;border-radius:10px;padding:8px 16px;color:#8a7e9a;font-size:12px;cursor:pointer;font-family:inherit;}
.lb-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;}
.lb-table th{color:#8a7e9a;font-weight:400;padding:5px 4px;border-bottom:1px solid #3a3045;}
.lb-table td{padding:5px 4px;color:#e0d8ec;border-bottom:1px solid rgba(58,48,69,0.3);}
.lb-table .lb-my td{color:#f0c060;font-weight:700;background:rgba(240,192,96,0.06);}
.lb-note,.lb-ok,.lb-err{font-size:12px;margin:6px 0;}
.lb-ok{color:#6fcf97;}
.lb-err{color:#ef4444;}
.lb-note{color:#8a7e9a;}
.lb-toggle{text-align:center;font-size:12px;color:#8a7e9a;cursor:pointer;padding:6px 0;margin-top:4px;transition:color .2s;}
.lb-toggle:hover{color:#f0c060;}
.lb-table-wrap{overflow-x:auto;}
.sel-container{display:flex;gap:20px;justify-content:center;align-items:center;margin-bottom:16px;}
.sel-card{text-align:center;cursor:pointer;transition:all .25s;opacity:.45;transform:scale(.88);}
.sel-card.selected{opacity:1;transform:scale(1);}
.sel-card img{transition:border-color .3s;}
.sel-name{font-size:15px;color:#e0d8ec;font-weight:700;margin-top:6px;}
.sel-desc{font-size:11px;color:#8a7e9a;margin-top:2px;}
.sel-hint{font-size:11px;color:#8a7e9a;margin-top:8px;}
@media (max-width:520px){
  .lv-card{width:44vw;padding:12px 8px;}
  .lv-key{display:none;}
}
/* Boss 入场横幅 */
#bossBanner{position:absolute;top:36%;left:0;right:0;text-align:center;z-index:8;pointer-events:none;font-size:30px;font-weight:900;color:#ef4444;text-shadow:0 0 20px rgba(239,68,68,.65),0 2px 4px #000;letter-spacing:3px;opacity:0;transform:scale(.8);transition:opacity .3s,transform .3s;}
#bossBanner.show{opacity:1;transform:scale(1);}
/* 竖屏强制横屏（触屏设备）：游戏容器旋转 -90° 全屏，隐藏顶栏 */
@media (orientation: portrait) and (pointer: coarse) {
  .shop-bar,.hamburger{display:none !important;}
  .game-container{position:fixed;top:100%;left:0;width:100vh;height:100vw;transform:rotate(-90deg);transform-origin:left top;}
}
</style>
</head>
<body>

<div id="shopNav"></div>
<script src="nav.js"></script>

<div class="game-container" aria-label="魔理沙幸存者">
  <div class="canvas-wrap">
  <div class="hud" id="hud">
    <div>
      <strong>🧹 魔理沙幸存者</strong>
      <span class="lvl-badge" id="hudLevel">Lv 1</span>
    </div>
    <div class="scoreboard">
      <span id="hudTime">⏱ 0:00</span>
      <span id="hudKills">💀 0</span>
      <span id="hudScore">000000</span>
      <span class="bestscore" id="hudBest">HI 000000</span>
    </div>
  </div>
  <div class="bars">
    <div class="bar hp" id="hpBar"><div id="hpFill"></div><span id="hpText">100 / 100</span></div>
    <div class="bar"><div id="xpFill"></div></div>
  </div>
  <div id="bossBar" class="hide"><span id="bossName"></span><div class="boss-track"><div id="bossFill"></div></div></div>
  <div id="bossBanner"></div>

  <canvas id="game" width="960" height="540"></canvas>

  <div class="overlay" id="loadingOverlay">
    <div class="loading-text">🧹 加载中...</div>
  </div>

  <div class="overlay hide" id="startOverlay">
    <h1>🧹 魔理沙幸存者</h1>
    <p>妖精大军来袭，攻击全自动，你只管走位！<br>
    WASD / 方向键移动 · 手机按住屏幕拖动<br>
    收集 P点 升级，三选一强化，活下去！<br>
    <span style="color:#ef4444;">2:00 起机制小怪出没 · 5:00 Boss 降临！</span></p>
    <button class="btn-start" onclick="showSelect()">✦ 出发</button>
    <div id="lbArea" class="hide"></div>
    <div id="qqOverlay" class="hide" style="margin-top:16px;">
      <img src="images/qq-group.png" alt="QQ群二维码" style="width:100px;border-radius:12px;border:2px solid #3a3045;" onerror="this.style.display='none'">
      <p style="font-size:11px;color:#8a7e9a;margin-top:6px;">群号 702973928</p>
    </div>
  </div>

  <div class="overlay hide" id="selectOverlay">
    <h1 id="selTitle">选择自机</h1>
    <div class="sel-container">
      <div class="sel-card selected" id="selMarisa" onclick="window._selChar('marisa')">
        <img id="imgMarisa" src="images/sprites/mairsa_show.png" style="width:170px;border-radius:12px;border:3px solid #f0c060;">
        <div class="sel-name">🧹 魔理沙</div>
        <div class="sel-desc">均衡型 · 专属符卡：☄️ 彗星</div>
      </div>
      <div class="sel-card" id="selReimu" onclick="window._selChar('reimu')">
        <img id="imgReimu" src="images/sprites/reimu_show.png" style="width:170px;border-radius:12px;border:3px solid #3a3045;">
        <div class="sel-name">⛩️ 灵梦</div>
        <div class="sel-desc">判定小 · 移速快 · 专属：🔮 阴阳玉</div>
      </div>
    </div>
    <button class="btn-start" onclick="confirmSelect()">✦ 确认</button>
    <p class="sel-hint">← → 切换 · 滑动切换 · Enter 确认</p>
  </div>

  <div class="overlay hide" id="levelOverlay">
    <h1>✨ 升级！Lv <span id="lvNum">2</span></h1>
    <p>选择一张强化卡（点击或按 1 / 2 / 3）</p>
    <div class="lv-cards" id="lvCards"></div>
  </div>
  </div>
</div>

<script src="js/marisa-survivor.js"></script>

</body>
</html>
