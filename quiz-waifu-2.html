}
.char-quote {

/* ── 海报 ── */

function render() {
  toggleAds(state);
  var app = document.getElementById('app');
  if (!app) return;
  if (state === 'intro') renderIntro(app);
  else if (state === 'quiz') renderQuestion(app);
  else if (state === 'loading') renderLoading(app);
  else if (state === 'result') renderResult(app);
  else if (state === 'poster') renderPoster(app);
}

function renderIntro(app) {

  bindCount('takeCount', {template:'已有 {n} 人完成鉴定'});

function startQuiz() {
  trackStart(TRACK_KEY);
  state = 'quiz'; idx = 0; answers = []; resultKey = null;
  quizClear(STORAGE_KEY);
  render();
}

function resumeQuiz() {
  var d = quizLoad(STORAGE_KEY);
  if (!d || d.idx <= 0) return;
  state = 'quiz'; idx = d.idx; answers = d.answers || []; resultKey = null;
  render();
}

function renderQuestion(app) {
  if (idx >= QUESTIONS.length) { state = 'loading'; render(); return; }
  var q = QUESTIONS[idx];
  var pct = Math.round((idx / QUESTIONS.length) * 100);
  var labels = 'ABCDEFGH';
  var html =
    (idx > 0 ? '<button class="btn-back" onclick="goBack()" style="display:block;margin:0 auto;">← 上一题</button>' : '') +
    '<div class="progress-wrap">' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="progress-text">' + (idx + 1) + ' / ' + QUESTIONS.length + '</div>' +
    '</div>' +
    '<div class="q-num">第 ' + (idx + 1) + ' 问</div>' +
    '<div class="q-text">' + q.q + '</div>' +
    '<div class="options">';
  for (var i = 0; i < q.opts.length; i++) {
    html +=
      '<button class="opt-btn" onclick="answer(' + i + ')">' +
      '<span class="opt-letter">' + (labels[i] || '?') + '</span>' +
      q.opts[i].t +
      '</button>';
  }
  html += '</div>';
  app.innerHTML = html;
}

function answer(choice) {
  answers.push(QUESTIONS[idx].opts[choice]);
  idx++;
  quizSave(STORAGE_KEY, {idx: idx, answers: answers});
  if (idx < QUESTIONS.length) { render(); return; }
  state = 'loading';
  render();
}

function goBack() {
  if (idx <= 0 || answers.length === 0) return;
  idx--; answers.pop();
  quizSave(STORAGE_KEY, {idx: idx, answers: answers});
  render();
}

// ── 加载 + 揭示 ──
function renderLoading(app) {
  app.innerHTML =
    '<div class="loading-wrap">' +
    '<div class="loading-orb"></div>' +
    '<p class="loading-text" id="ltxt">' + LOADING_STEPS[0] + '</p>' +
    '</div>';
  cycleLoading(1);
}

async function cycleLoading(i) {
  if (i >= LOADING_STEPS.length) {
    await sleep(800);
    resultKey = calcResult();
    var r = RESULTS[resultKey];
    showReveal('🔮 二次元鉴定完成', r.name, r.color || 'var(--gold)', '赛博心理学引擎 · 结果生成中…', function() {
      state = 'result';
      render();
    });
    return;
  }
  await sleep(500 + Math.random() * 500);
  var lt = document.getElementById('ltxt');
  if (lt) lt.textContent = LOADING_STEPS[i];
  cycleLoading(i + 1);
}

function calcResult() {
  var keys = Object.keys(RESULTS);
  return keys[Math.floor(Math.random() * keys.length)];
}

async function buildPoster() {
  var r = RESULTS[resultKey] || RESULTS[Object.keys(RESULTS)[0]];
  var W = POSTER_W, H = POSTER_H;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');

  ctx.fillStyle = '#16121a'; ctx.fillRect(0, 0, W, H);
  var g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, 'rgba(224,64,128,.06)');
  g.addColorStop(1, 'rgba(124,77,255,.06)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  var pad = 40;
  ctx.fillStyle = '#201a26';
  roundRect(ctx, pad, pad, W - pad * 2, H - pad * 2, 28); ctx.fill();

  var bar = ctx.createLinearGradient(pad, 0, W - pad, 0);
  bar.addColorStop(0, r.color || '#e04080');
  bar.addColorStop(.5, '#7c4dff');
  bar.addColorStop(1, r.color || '#e04080');
  ctx.fillStyle = bar;
  roundRect(ctx, pad, pad, W - pad * 2, 6, 3); ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = r.color || '#e04080';
  ctx.font = '600 20px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('霧 雨 魔 法 店 · 二次元老婆鉴定', W / 2, 110);

  var portrait = await loadImg(r.img);
  var cx = W / 2, cy = 260, R = 96;

  // 光晕
  var glow = ctx.createRadialGradient(cx, cy, R * .6, cx, cy, R * 1.5);
  glow.addColorStop(0, r.color + '30');
  glow.addColorStop(.5, r.color + '08');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow; ctx.fillRect(cx - R * 1.5, cy - R * 1.5, R * 3, R * 3);

  // 圆形裁切绘制头像
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
  if (portrait) {
    var s = Math.max((R * 2) / portrait.width, (R * 2) / portrait.height);
    var dw = portrait.width * s, dh = portrait.height * s;
    ctx.drawImage(portrait, cx - dw / 2, cy - dh / 2, dw, dh);
  } else {
    ctx.fillStyle = '#201a26'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '80px sans-serif'; ctx.textBaseline = 'middle';
    ctx.fillText(r.name.charAt(0), cx, cy + 8); ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();

  ctx.lineWidth = 5;
  ctx.strokeStyle = r.color || '#e04080';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.beginPath(); ctx.arc(cx, cy, R + 4, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = '#8a7e9a';
  ctx.font = '14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('我命中注定的二次元老婆是', W / 2, 420);

  ctx.fillStyle = r.color || '#e04080';
  ctx.shadowColor = r.color + '50'; ctx.shadowBlur = 14;
  ctx.font = '800 48px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(r.name, W / 2, 480);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  ctx.fillStyle = '#8a7e9a';
  ctx.font = '14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('出自 ' + r.source, W / 2, 510);

  // 标签
  ctx.font = '13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  var tags = r.tags, gap = 14, ty = 555;
  var widths = tags.map(function(t) { return ctx.measureText(t).width + 28; });
  var totalW = widths.reduce(function(a, b) { return a + b; }, 0) + gap * (tags.length - 1);
  var tx = (W - totalW) / 2;
  for (var i = 0; i < tags.length; i++) {
    ctx.fillStyle = 'rgba(255,255,255,.03)';
    ctx.strokeStyle = r.color + '50';
    ctx.lineWidth = 1.5;
    roundRect(ctx, tx, ty - 20, widths[i], 32, 15); ctx.fill(); ctx.stroke();
    ctx.fillStyle = r.color || '#e04080';
    ctx.fillText(tags[i], tx + widths[i] / 2, ty + 1);
    tx += widths[i] + gap;
  }

  // 简介
  ctx.fillStyle = '#c8c0d4';
  ctx.font = '14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  wrapText(ctx, r.desc, W / 2, 620, W - pad * 2 - 60, 24);

  // 台词
  ctx.fillStyle = r.color || '#e04080';
  ctx.font = 'italic 15px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  var quoteLines = wrapToLines(ctx, '「' + r.quote + '」', W - pad * 2 - 80);
  var qy = H - pad - 255 - quoteLines.length * 22;
  for (var k = 0; k < quoteLines.length; k++) {
    ctx.fillText(quoteLines[k], W / 2, qy + k * 24);
  }

  // QR 码
  var siteImg = await loadImg(QR_IMG);
  var qqImg = await loadImg(QQ_IMG);
  var qs = 126, gap2 = 48;
  var totalQW = qs * 2 + gap2;
  var leftX = (W - totalQW) / 2;
  var rightX = leftX + qs + gap2;
  var qy2 = H - pad - 232;
  drawQRBox(ctx, siteImg, leftX, qy2, qs, '扫码开测', SITE_URL, r.color || '#e04080');
  drawQRBox(ctx, qqImg, rightX, qy2, qs, '加 QQ 群', '群号 ' + QQ_GROUP, '#b89fff');

  var pi = document.getElementById('posterImg');
  var pl = document.getElementById('posterLoading');
  var dl = document.getElementById('posterDl');
  var dataUrl = null;
  try { dataUrl = cv.toDataURL('image/png'); } catch (e) { dataUrl = null; }

  if (pl) { pl.style.display = 'none'; }
  if (dataUrl) {
    if (pi) { pi.src = dataUrl; pi.style.display = 'block'; }
    if (dl) { dl.href = dataUrl; dl.style.display = 'inline-flex'; }
  } else {
    if (pi && pi.parentNode) {
      cv.className = 'poster-img';
      cv.style.display = 'block';
      pi.parentNode.replaceChild(cv, pi);
    }
    var hint = document.querySelector('.poster-hint');
    if (hint) hint.textContent = '当前环境无法导出图片。部署到 ' + SITE_URL + ' 线上访问即可正常保存。';
  }
}

render();
</script>

</body>
</html>
