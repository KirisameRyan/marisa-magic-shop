var LOADING_STEPS = [
  '正在加载 500 角色数据库…',
  '第 1 层筛选：性格 + 年龄 + 世界观…',
  '第 2 层筛选：身份 + 相处模式 + 沟通…',
  '第 3 层细筛：外貌匹配度计算…',
  '第 4 层精排：加权排序中…',
  '鉴定完成！'
];
var SHARE_TEXT = '我在霧雨魔法店测出的二次元老婆 TOP 1 是【{name}】！500 角色数据库 + 4 层精准筛选，你也来测：';

// ── 渲染 ──
function render() {
  toggleAds(state);
  var app = document.getElementById('app');
  if (!app) return;
  if (state === 'intro') renderIntro(app);
  else if (state === 'quiz') renderQuestion(app);
  else if (state === 'loading') renderLoading(app);
  else if (state === 'result') renderResult(app);
  else if (state === 'poster') renderPoster(app);
}

function renderIntro(app) {
  var resumeHTML = resumeButton(STORAGE_KEY, '继续上次测试') || '';
  app.innerHTML =
    '<div class="intro">' +
    '<div class="intro-badge">' + BADGE_TEXT + '</div>' +
    '<h1>' + QUIZ_TITLE + '</h1>' +
    '<p class="sub" style="white-space:pre-line;">' + QUIZ_SUBTITLE + '</p>' +
    '<p style="font-size:11px;color:var(--muted);margin-bottom:8px;" id="takeCount"></p>' +
    resumeHTML +
    '<button class="btn btn-main" style="max-width:260px;margin:0 auto;" onclick="startQuiz()">开始鉴定 →</button>' +
    '<a href="index.html" class="home-link">← 返回魔法店</a>' +
    '</div>';
  bindCount('takeCount', {template:'已有 {n} 人完成鉴定'});
}

function startQuiz() {
  trackStart(TRACK_KEY);
  characterDB = window.WAIFU_DB;
  state = 'quiz'; idx = 0; answers = []; results = null;
  quizClear(STORAGE_KEY);
  render();
}

function resumeQuiz() {
  var d = quizLoad(STORAGE_KEY);
  if (!d || d.idx <= 0) return;
  state = 'quiz'; idx = d.idx; answers = d.answers || []; results = null;
  render();
}

function getLayerLabel(q) {
  if (q.layer === 1) return '<span class="layer-badge">第 1 层 · 粗筛</span>';
  if (q.layer === 2) return '<span class="layer-badge">第 2 层 · 中筛</span>';
  if (q.layer === 3) return '<span class="layer-badge">第 3 层 · 细筛</span>';
  if (q.layer === 4) return '<span class="layer-badge">第 4 层 · 精排</span>';
  return '';
}

function renderQuestion(app) {
  if (idx >= QUESTIONS.length) { state = 'loading'; render(); return; }
  var q = QUESTIONS[idx];
  var pct = Math.round((idx / QUESTIONS.length) * 100);
  var labels = 'ABCDEFGH';
  var html =
    (idx > 0 ? '<button class="btn-back" onclick="goBack()" style="display:block;margin:0 auto;">← 上一题</button>' : '') +
    '<div class="progress-wrap">' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="progress-text">' + (idx + 1) + ' / ' + QUESTIONS.length + '</div>' +
    '</div>' +
    getLayerLabel(q) +
    '<div class="q-num">第 ' + (idx + 1) + ' 问</div>' +
    '<div class="q-text">' + q.q + '</div>' +
    '<div class="options">';
  for (var i = 0; i < q.opts.length; i++) {
    html +=
      '<button class="opt-btn" onclick="answer(' + i + ')">' +
      '<span class="opt-letter">' + (labels[i] || '?') + '</span>' +
      q.opts[i].t +
      '</button>';
  }
  html += '</div>';
  app.innerHTML = html;
}

function answer(choice) {
  answers.push({ idx: idx, choice: choice, dim: QUESTIONS[idx].dim, tags: QUESTIONS[idx].opts[choice].tags, layer: QUESTIONS[idx].layer, weightDims: QUESTIONS[idx].opts[choice].weightDims, penaltyTags: QUESTIONS[idx].opts[choice].penaltyTags });
  idx++;
  quizSave(STORAGE_KEY, { idx: idx, answers: answers });
  if (idx < QUESTIONS.length) { render(); return; }
  state = 'loading';
  render();
}

function goBack() {
  if (idx <= 0 || answers.length === 0) return;
  idx--; answers.pop();
  quizSave(STORAGE_KEY, { idx: idx, answers: answers });
  render();
}

// ── 加载动画 ──
function renderLoading(app) {
  app.innerHTML =
    '<div class="loading-wrap">' +
    '<div class="loading-orb"></div>' +
    '<p class="loading-text" id="ltxt">' + LOADING_STEPS[0] + '</p>' +
    '</div>';
  cycleLoading(1);
}

async function cycleLoading(i) {
  if (i >= LOADING_STEPS.length) {
    await sleep(600);
    results = computeResults();
    if (!results || results.length === 0) {
      state = 'result';
      render();
      return;
    }
    var top = results[0];
    showReveal('🔮 二次元鉴定完成', top.name, '#e04080', '500 角色数据库中精准匹配…', function() {
      state = 'result';
      render();
    });
    return;
  }
  await sleep(400 + Math.random() * 400);
  var lt = document.getElementById('ltxt');
  if (lt) lt.textContent = LOADING_STEPS[i];
  cycleLoading(i + 1);
}

// ── 核心匹配引擎（4 级渐进放宽 + 兜底随机）──
function computeResults() {
  if (!characterDB || characterDB.length === 0) return [];

  var l1Answers = answers.filter(function(a) { return a.layer === 1; });
  var l2Answers = answers.filter(function(a) { return a.layer === 2; });
  var l3Answers = answers.filter(function(a) { return a.layer === 3; });
  var l4Answers = answers.filter(function(a) { return a.layer === 4; });
  var q12 = l4Answers[0] || null;
  var q13 = l4Answers[1] || null;

  // Level 0: 严格模式 — L1+L2 硬过滤 + L3 软加权
  var r = matchAndScore(l1Answers.concat(l2Answers), l3Answers, q12, q13, characterDB);
  if (r.length >= 3) return r.slice(0, 5);

  // Level 1: 放宽 — 仅 L1 硬过滤，L2+L3 都转软加权
  r = matchAndScore(l1Answers, l2Answers.concat(l3Answers), q12, q13, characterDB);
  if (r.length >= 3) return r.slice(0, 5);

  // Level 2: 再放宽 — 全部软加权，无硬过滤
  r = matchAndScore([], l1Answers.concat(l2Answers, l3Answers), q12, q13, characterDB);
  if (r.length >= 3) return r.slice(0, 5);

  // Level 3: 究极兜底 — 纯随机排名
  var shuffled = characterDB.slice().sort(function() { return Math.random() - 0.5; });
  return shuffled.slice(0, 5).map(function(c, i) { return fmtChar(c, 93 - i * 4); });
}

function matchAndScore(hardFilters, softFilters, q12, q13, pool) {
  // 硬过滤
  var passed = pool.filter(function(char) {
    for (var i = 0; i < hardFilters.length; i++) {
      var a = hardFilters[i];
      if (!a.tags || a.tags.length === 0) continue;
      if (!hasAny(getTagIds(char, a.dim), a.tags)) return false;
    }
    return true;
  });

  // 软加权打分
  var scored = passed.map(function(char) {
    var score = 0;
    for (var i = 0; i < softFilters.length; i++) {
      var a = softFilters[i];
      if (!a.tags || a.tags.length === 0) continue;
      var ct = getTagIds(char, a.dim);
      for (var j = 0; j < a.tags.length; j++) {
        if (ct.indexOf(a.tags[j]) !== -1) score += 1;
      }
    }
    return { char: char, score: score };
  });

  // Q12 加权 + Q13 惩罚
  scored.forEach(function(item) {
    if (q12 && q12.weightDims) {
      var allAns = hardFilters.concat(softFilters);
      for (var i = 0; i < allAns.length; i++) {
        var a = allAns[i];
        if (!a || !a.tags || a.tags.length === 0) continue;
        if (q12.weightDims.indexOf(a.dim) !== -1) {
          var ct = getTagIds(item.char, a.dim);
          for (var j = 0; j < a.tags.length; j++) {
            if (ct.indexOf(a.tags[j]) !== -1) item.score += 2;
          }
        }
      }
    }
    if (q13 && q13.penaltyTags && q13.penaltyTags.length > 0) {
      for (var dim in item.char.tags) {
        var ct = item.char.tags[dim].map(function(t) { return t.id; });
        for (var k = 0; k < q13.penaltyTags.length; k++) {
          if (ct.indexOf(q13.penaltyTags[k]) !== -1) item.score -= 2;
        }
      }
    }
  });

  scored.sort(function(a, b) { return b.score - a.score; });
  if (scored.length === 0) return [];
  var max = scored[0].score;
  return scored.map(function(item) {
    var pct = max > 0 ? Math.round(80 + (Math.max(0, item.score) / Math.max(1, max)) * 18) : 80;
    return fmtChar(item.char, pct);
  });
}

function getTagIds(char, dim) {
  return (char.tags && char.tags[dim]) ? char.tags[dim].map(function(t) { return t.id; }) : [];
}

function fmtChar(char, match) {
  return {
    id: char.id, name: char.name, name_native: char.name_native,
    image: char.image, description: char.description,
    source_anime: char.source_anime, tags: char.tags, match: match
  };
}

function hasAny(charTags, answerTags) {
  for (var i = 0; i < answerTags.length; i++) {
    if (charTags.indexOf(answerTags[i]) !== -1) return true;
  }
  return false;
}

    '<div class="disclaimer">⚠️ 本鉴定基于标签匹配引擎，匹配结果可能因标签覆盖度而有偏差。数据来源：AniList。</div>';

}

function shareIt() {
  var name = (results && results[0]) ? results[0].name : '';

async function buildPoster() {
  var r = results[0];
  if (!r) return;
  var W = POSTER_W, H = POSTER_H;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');

  ctx.fillStyle = '#16121a'; ctx.fillRect(0, 0, W, H);
  var g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, 'rgba(224,64,128,.06)');
  g.addColorStop(1, 'rgba(124,77,255,.06)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  var pad = 40;
  ctx.fillStyle = '#201a26';
  roundRect(ctx, pad, pad, W - pad * 2, H - pad * 2, 28); ctx.fill();

  var bar = ctx.createLinearGradient(pad, 0, W - pad, 0);
  bar.addColorStop(0, '#e04080');
  bar.addColorStop(.5, '#7c4dff');
  bar.addColorStop(1, '#e04080');
  ctx.fillStyle = bar;
  roundRect(ctx, pad, pad, W - pad * 2, 6, 3); ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#e04080';
  ctx.font = '600 18px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('霧 雨 魔 法 店 · 二次元老婆鉴定', W / 2, 110);

  var portrait = await loadImg(r.image);
  var cx = W / 2, cy = 255, R = 96;

  var glow = ctx.createRadialGradient(cx, cy, R * .6, cx, cy, R * 1.5);
  glow.addColorStop(0, 'rgba(224,64,128,.15)');
  glow.addColorStop(.5, 'rgba(124,77,255,.06)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow; ctx.fillRect(cx - R * 1.5, cy - R * 1.5, R * 3, R * 3);

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
  if (portrait) {
    var s = Math.max((R * 2) / portrait.width, (R * 2) / portrait.height);
    ctx.drawImage(portrait, cx - portrait.width * s / 2, cy - portrait.height * s / 2, portrait.width * s, portrait.height * s);
  } else {
    ctx.fillStyle = '#201a26'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '80px sans-serif'; ctx.textBaseline = 'middle';
    ctx.fillText(r.name.charAt(0), cx, cy + 8); ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();

  ctx.lineWidth = 5; ctx.strokeStyle = '#e04080';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = '#8a7e9a';
  ctx.font = '14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('我命中注定的二次元老婆是', W / 2, 415);

  var gradient = ctx.createLinearGradient(W / 2 - 150, 430, W / 2 + 150, 430);
  gradient.addColorStop(0, '#e04080'); gradient.addColorStop(.5, '#7c4dff'); gradient.addColorStop(1, '#e04080');
  ctx.fillStyle = gradient;
  ctx.shadowColor = 'rgba(224,64,128,.4)'; ctx.shadowBlur = 14;
  ctx.font = '800 48px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(r.name, W / 2, 475);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  ctx.fillStyle = '#8a7e9a';
  ctx.font = '14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(r.source_anime || '', W / 2, 505);

  ctx.fillStyle = '#e04080';
  ctx.font = '900 26px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('匹配度 ' + r.match + '%', W / 2, 545);

  ctx.fillStyle = '#c8c0d4';
  ctx.font = '13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  wrapText(ctx, (r.description || '').slice(0, 200), W / 2, 600, W - pad * 2 - 60, 24);

  if (results.length > 1) {
    ctx.fillStyle = '#8a7e9a';
    ctx.font = '13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    var altText = 'TOP ' + (results.length > 1 ? '2-5' : '') + ': ';
    for (var k = 1; k < Math.min(results.length, 5); k++) {
      altText += results[k].name + '  ';
    }
    var altLines = wrapToLines(ctx, altText, W - pad * 2 - 40);
    for (var m = 0; m < altLines.length; m++) {
      ctx.fillText(altLines[m], W / 2, 750 + m * 20);
    }
  }

  var siteImg = await loadImg(QR_IMG);
  var qqImg = await loadImg(QQ_IMG);
  var qs = 120, gap2 = 48;
  var totalQW = qs * 2 + gap2;
  var leftX = (W - totalQW) / 2;
  var rightX = leftX + qs + gap2;
  var qy2 = H - pad - 230;
  drawQRBox(ctx, siteImg, leftX, qy2, qs, '扫码开测', SITE_URL, '#e04080');
  drawQRBox(ctx, qqImg, rightX, qy2, qs, '加 QQ 群', '群号 ' + QQ_GROUP, '#b89fff');

  var pi = document.getElementById('posterImg');
  var pl = document.getElementById('posterLoading');
  var dl = document.getElementById('posterDl');
  var dataUrl = null;
  try { dataUrl = cv.toDataURL('image/png'); } catch (e) { dataUrl = null; }

  if (pl) pl.style.display = 'none';
  if (dataUrl) {
    if (pi) { pi.src = dataUrl; pi.style.display = 'block'; }
    if (dl) { dl.href = dataUrl; dl.style.display = 'inline-flex'; }
  } else {
    if (pi && pi.parentNode) {
      cv.className = 'poster-img';
      cv.style.display = 'block';
      pi.parentNode.replaceChild(cv, pi);
    }
  }
}
