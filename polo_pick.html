<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>抽象角色大乱斗 · 选人</title>
<script src="js/analytics.js"></script>
<script src="js/page-base.js"></script>
<link rel="stylesheet" href="css/common.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1520;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden;height:100vh;}
.game-container{display:flex;flex-direction:column;align-items:center;width:100%;height:calc(100vh - 48px);background:#1a1520;overflow:hidden;}
.canvas-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;position:relative;min-height:0;}
canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:1/1;border:1px solid #3a3045;border-radius:12px;background:#141019;}
.hud{position:absolute;top:10px;left:16px;right:16px;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;}
.hud .side{width:200px;max-width:32%;}
.hud .side.right{text-align:right;}
.hud .h-name{font-size:14px;font-weight:800;color:#e0d8ec;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.8);margin-bottom:3px;}
.hud .bar{height:11px;border-radius:6px;background:rgba(58,48,69,.6);overflow:hidden;border:1px solid rgba(255,255,255,.18);position:relative;}
.hud .bar>div{height:100%;border-radius:6px;transition:width .12s;}
#p1Hp{background:linear-gradient(90deg,#c22,#ef4444);width:100%;}
#p2Hp{background:linear-gradient(90deg,#6b4f1a,#f0c060);width:100%;}
.hud .h-hp{position:absolute;inset:0;font-size:8px;line-height:11px;text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.85);z-index:2;}
#timer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;color:#f0c060;text-shadow:0 1px 4px rgba(0,0,0,.9);letter-spacing:1px;}
.mute-row{position:absolute;bottom:10px;right:12px;z-index:6;display:flex;gap:6px;pointer-events:auto;}
.mute-row button{width:36px;height:36px;border-radius:10px;border:1px solid #3a3045;background:rgba(36,30,42,.85);font-size:17px;cursor:pointer;font-family:inherit;line-height:1;transition:transform .12s;}
.mute-row button:hover{transform:scale(1.08);}
.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#6d6278;letter-spacing:2px;pointer-events:none;z-index:5;}

/* ── 选人 ── */
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,21,32,.93);z-index:10;border-radius:12px;overflow-y:auto;padding:18px;}
.overlay.hide{display:none;}
.ov-icon{font-size:58px;margin-bottom:4px;filter:drop-shadow(0 0 18px rgba(240,192,96,.45));}
h1{font-size:26px;color:#f0c060;letter-spacing:5px;margin-bottom:2px;text-shadow:0 0 24px rgba(240,192,96,.35);}
.ov-sub{font-size:12px;color:#8a7e9a;letter-spacing:3px;margin-bottom:12px;}
.ov-desc{font-size:12px;color:#8a7e9a;text-align:center;line-height:1.7;margin-bottom:12px;max-width:560px;}
.pick-row{display:flex;align-items:stretch;justify-content:center;gap:10px;width:100%;max-width:720px;margin-bottom:14px;}
.pick-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.pick-title{font-size:12px;font-weight:800;color:#b89fff;letter-spacing:3px;text-align:center;margin-bottom:6px;}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
.char-card{background:#241e2a;border:2px solid #3a3045;border-radius:14px;padding:8px 8px 9px;cursor:pointer;text-align:center;transition:all .12s;position:relative;}
.char-card:hover{border-color:#5a4c6e;transform:translateY(-2px);}
.char-card.sel{border-color:#f0c060;box-shadow:0 0 0 2px rgba(240,192,96,.25),0 6px 18px rgba(240,192,96,.12);}
.cc-img-wrap{width:56px;height:56px;border-radius:50%;overflow:hidden;margin:0 auto 5px;background:#141019;border:2px solid #3a3045;position:relative;}
.cc-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.cc-emoji{position:absolute;right:-4px;bottom:-4px;font-size:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));}
.cc-name{font-size:14px;font-weight:800;color:#e0d8ec;}
.cc-sub{font-size:9px;color:#8a7e9a;margin-bottom:4px;}
.cc-skill{font-size:10px;color:#f0c060;font-weight:700;background:rgba(240,192,96,.08);border-radius:6px;padding:2px 4px;display:inline-block;margin-bottom:3px;}
.cc-desc{font-size:9px;color:#8a7e9a;line-height:1.45;min-height:26px;}
.cc-stats{font-size:9px;color:#ff8a8a;font-weight:700;margin-top:3px;}
.pick-vs{align-self:center;font-size:22px;font-weight:900;color:#8a7e9a;letter-spacing:2px;}
.btn-start{font-size:17px;font-weight:800;padding:12px 52px;border-radius:16px;border:none;background:linear-gradient(135deg,#f0c060,#e8a830);color:#1a1520;cursor:pointer;letter-spacing:3px;transition:transform .15s;font-family:inherit;margin-bottom:8px;}
.btn-start:hover{transform:scale(1.05);}
.btn-start:active{transform:scale(.95);}
.btn2{font-size:13px;font-weight:700;padding:9px 28px;border-radius:12px;border:1px solid #3a3045;background:#241e2a;color:#b89fff;cursor:pointer;letter-spacing:2px;transition:transform .15s;font-family:inherit;}
.btn2:hover{transform:scale(1.03);}
.ov-note{font-size:10px;color:#6d6278;margin-top:8px;letter-spacing:1px;}
.seed-row{display:flex;align-items:center;gap:6px;margin:0 0 12px;}
.seed-row span{font-size:11px;color:#8a7e9a;letter-spacing:1px;}
#seedInput{width:110px;background:#141019;border:1px solid #3a3045;border-radius:8px;padding:6px 8px;color:#f0c060;font-size:13px;text-align:center;outline:none;font-family:inherit;}
#seedGo{border:1px solid #3a3045;background:#241e2a;color:#f0c060;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div class="game-container">
  <div class="canvas-wrap">
    <canvas id="game" width="480" height="480"></canvas>

    <div class="mute-row">
      <button id="btnMusic" title="主题曲">🎵</button>
      <button id="btnSfx" title="音效">🔊</button>
    </div>

    <div class="hud">
      <div class="side">
        <div class="h-name" id="p1Name">灵梦</div>
        <div class="bar"><div id="p1Hp"></div><span class="h-hp" id="p1HpTxt"></span></div>
      </div>
      <span id="timer">0.0s</span>
      <div class="side right">
        <div class="h-name" id="p2Name">魔理沙</div>
        <div class="bar"><div id="p2Hp"></div><span class="h-hp" id="p2HpTxt"></span></div>
      </div>
    </div>

    <div class="overlay" id="ovSelect">
      <div class="ov-icon">⚔️</div>
      <h1>抽象角色大乱斗</h1>
      <div class="ov-sub">PICK YOUR FIGHTER</div>
      <div class="ov-desc">选人即开打，之后一切交给物理。<br>灵梦玉海滚雪球、魔理沙蓄力激光、褚嬴落子封路、寸头猪冲刺拱人、野生狗奶盾奶一体、许家印盖倒楼就跑路——残血狂暴攻速翻倍，90 秒不分胜负按血量定生死。</div>
      <div class="pick-row">
        <div class="pick-col">
          <div class="pick-title">一方</div>
          <div class="pick-grid" id="pickA"></div>
        </div>
        <div class="pick-vs">VS</div>
        <div class="pick-col">
          <div class="pick-title">二方</div>
          <div class="pick-grid" id="pickB"></div>
        </div>
      </div>
      <button class="btn-start" id="btnFight">开 打 !</button>
      <div class="ov-note">回车开打 · R 键重开 · 种子随机，谁赢全看天命</div>
    </div>

    <div class="overlay hide" id="ovResult">
      <div class="ov-icon" id="resIcon">👑</div>
      <h1 id="resTitle">胜者</h1>
      <div class="ov-sub" id="resSub"></div>
      <div class="seed-row">
        <span>观战码</span>
        <input id="seedInput" inputmode="numeric" maxlength="6">
        <button id="seedGo">▶ 复现</button>
      </div>
      <button class="btn-start" id="btnAgain">再来一局</button>
      <button class="btn2" id="btnPick">换人再来</button>
      <div class="ov-note">输入观战码可复现同一场对局</div>
    </div>

    <div class="hint">PURE AUTO BATTLE · 纯观战</div>
  </div>
</div>
<script src="js/polo-characters.js"></script>
<script src="js/polo-ball.js"></script>
</body>
</html>
