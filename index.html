<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="css/common.css">
<script src="js/analytics.js"></script>
<script src="js/page-base.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霧雨魔法店</title>

<style>


 .container { max-width: 780px; width: 100%; position:relative; z-index:1; }

 /* 入场动效(common.css fadeUp) */
 .header, .marisa-frame, .divider, .shelf { animation: fadeUp .5s ease both; }
 .marisa-frame { animation-delay: .08s; }
 .divider { animation-delay: .14s; }
 .cards .card { animation: fadeUp .45s ease both; }
 .cards .card:nth-child(2) { animation-delay: .06s; }
 .cards .card:nth-child(3) { animation-delay: .12s; }
 .cards .card:nth-child(4) { animation-delay: .18s; }

 /* Header */
 .header { text-align: center; margin-bottom: 36px; }
 .shop-sign { display:inline-block; position:relative; margin-bottom: 8px; }
 .shop-sign h1 {
 font-size: 36px; font-weight: 900; letter-spacing:4px;
 background: linear-gradient(135deg, var(--gold), #ffe8b0, var(--gold));
 -webkit-background-clip: text; -webkit-text-fill-color: transparent;
 background-clip: text; filter: drop-shadow(0 0 12px rgba(240,192,96,.3));
 }
 .shop-sign .sub-jp { font-size: 12px; color: var(--gold-dim); letter-spacing:6px; margin-top: 4px; }
 .header .owner {
 font-size: 13px; color: var(--muted); margin-top: 6px;
 display: flex; align-items: center; justify-content: center; gap: 6px;
 }
 .header .owner .dot {
 width:6px; height:6px; border-radius:50%; background:var(--purple);
 animation: pulse 2s infinite;
 }
 @keyframes pulse { 0%,100% { opacity:.4; transform:scale(1); } 50% { opacity:1; transform:scale(1.5); } }

 /* Marisa Image */
 .marisa-frame { text-align: center; margin-bottom: 28px; }
 .marisa-img {
 max-width: 180px; max-height: 220px; border-radius: 16px;
 opacity:.85; filter: drop-shadow(0 8px 32px rgba(176,159,255,.25));
 transition: all .4s;
 }
 .marisa-img:hover { opacity:1; transform:scale(1.03); }
 .marisa-placeholder {
 width:180px; height:180px; margin:0 auto; border-radius:16px;
 background: linear-gradient(135deg, rgba(176,159,255,.15), rgba(240,192,96,.1));
 border: 1px dashed var(--border);
 display: flex; align-items: center; justify-content: center;
 font-size: 64px; color: var(--purple-dim);
 }

 /* Divider */
 .divider {
 display:flex; align-items:center; gap:14px; margin-bottom: 28px;
 }
 .divider::before, .divider::after {
 content:''; flex:1; height:1px;
 background: linear-gradient(90deg, transparent, var(--border), transparent);
 }
  .divider span { font-size: 11px; color: var(--muted); letter-spacing:3px; }

  /* Search */
  .search-box {
    position: relative; max-width: 480px; margin: 0 auto 32px;
  }
  .search-box .search-ico {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 15px; opacity: .6; pointer-events: none;
  }
  .search-box input {
    width: 100%; background: rgba(255,255,255,.03);
    border: 1px solid var(--border); border-radius: 24px;
    padding: 12px 18px 12px 42px; font-size: 14px; color: var(--text);
    font-family: inherit; outline: none; transition: border-color .2s;
  }
  .search-box input:focus { border-color: var(--gold); }
  .search-box input::placeholder { color: var(--muted); opacity: .5; }
  .search-empty {
    display: none; text-align: center; padding: 30px 0 10px;
    font-size: 13px; color: var(--muted);
  }

 /* Shelf Sections */
 .shelf { margin-bottom: 36px; }
 .shelf-title {
 font-size: 11px; color: var(--gold-dim); letter-spacing:3px;
 margin-bottom: 16px; padding-bottom: 10px;
 border-bottom: 1px solid var(--border);
 display: flex; align-items: center; gap: 8px;
 }
 .shelf-title .shelf-icon { font-size: 16px; }
 .shelf-title .shelf-count { margin-left: auto; font-size: 10px; color: var(--muted); letter-spacing: 1px; }

 .cards { display: flex; gap: 14px; flex-wrap: wrap; }
 .card {
 flex:1; min-width: 210px; max-width: calc(50% - 7px);
 background: var(--card); border-radius: 18px;
 padding: 24px 20px; border: 1px solid var(--border);
 text-decoration: none; color:inherit;
 transition: all .25s; position:relative; overflow:hidden;
 }
 .card:hover {
 background: var(--card-hover);
 border-color: var(--purple-dim);
 transform: translateY(-3px);
 box-shadow: 0 12px 36px rgba(0,0,0,.3);
 }
 .card .icon {
 width:40px; height:40px; border-radius:10px; display:flex;
 align-items:center; justify-content:center; font-size:20px;
 margin-bottom: 12px;
 }

 /* Card accent colors per shelf */
 .card-green .icon, .card-green { border-color: rgba(111,207,151,.15); }
 .card-green:hover { border-color: var(--green); }

 .card-purple .icon, .card-purple { border-color: rgba(176,159,255,.15); }
 .card-purple:hover { border-color: var(--purple); }

 .card-pink .icon, .card-pink { border-color: rgba(244,114,182,.15); }
 .card-pink:hover { border-color: var(--pink); }

 .card-gold .icon, .card-gold { border-color: rgba(240,192,96,.15); }
 .card-gold:hover { border-color: var(--gold); }

 .card-blue .icon, .card-blue { border-color: rgba(34,211,238,.12); }
 .card-blue:hover { border-color: #22d3ee; }

 .card-lime .icon, .card-lime { border-color: rgba(168,224,108,.15); }
 .card-lime:hover { border-color: #a8e06c; }

 .card-dark .icon, .card-dark { border-color: rgba(136,136,136,.15); }
 .card-dark:hover { border-color: #888; }

 .card-red .icon, .card-red { border-color: rgba(239,68,68,.12); }
 .card-red:hover { border-color: #ef4444; }

 .card .tag { font-size:10px; letter-spacing:2px; margin-bottom:6px; }
 .card-green .tag { color:var(--green); }
 .card-purple .tag { color:var(--purple); }
 .card-pink .tag { color:var(--pink); }
 .card-gold .tag { color:var(--gold); }
 .card-blue .tag { color:#22d3ee; }
 .card-lime .tag { color:#a8e06c; }
 .card-dark .tag { color:#888; }
 .card-red .tag { color:#ef4444; }

 .card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
 .card .desc { font-size: 12px; color:var(--muted); line-height:1.5; }

 .card-future { opacity:.5; cursor:default; }
 .card-future:hover { opacity:.7; transform:none; border-color:var(--border); box-shadow:none; background:var(--card); }

 /* Footer */
 .qq-section {
 text-align: center; margin: 40px 0 24px; padding-top: 24px;
 border-top: 1px solid var(--border);
 }
 .qq-section img {
 width: 200px; border-radius: 16px; border: 2px solid var(--border);
 box-shadow: 0 8px 32px rgba(0,0,0,.3);
 }
 .qq-section p { margin-top: 12px; font-size: 13px; color: var(--muted); line-height: 1.8; }

 .footer { text-align: center; font-size: 11px; color: var(--muted); padding-top: 20px; border-top: 1px solid var(--border); line-height:1.8; }
 .footer .broom { display:inline-block; animation: float 3s ease infinite; }
 @keyframes float { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-6px) rotate(5deg); } }

 @media (max-width: 600px) {
 .cards { flex-direction:column; }
 .card { max-width:100%; }
 .shop-sign h1 { font-size:28px; }
 }


</style>
</head>
