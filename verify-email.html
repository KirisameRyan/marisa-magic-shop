<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>邮箱验证 · 霧雨魔法店</title><script>window.MMS_VERIFY_TOKEN=new URLSearchParams(location.search).get('t')||'';history.replaceState(null,'',location.pathname);</script><link rel="stylesheet" href="css/common.css"><script src="js/api-config.js"></script></head><body><main class="container" style="max-width:440px;margin:12vh auto"><h1>验证你的邮箱</h1><p>邮箱为可选找回方式，不影响登录和交易。</p><button id="verify" class="btn">确认验证邮箱</button><p id="result" role="status"></p><a href="gensokyo_exchange.html">返回幻想乡交易所</a></main><script>
document.getElementById('verify').onclick=async function(){this.disabled=true;const result=document.getElementById('result');try{const f=new FormData();f.append('action','verify_email');f.append('token',window.MMS_VERIFY_TOKEN);const r=await fetch((window.API_BASE||'')+'api/auth.php',{method:'POST',body:f});const data=await r.json();result.textContent=data.msg||data.error||'操作失败';if(!data.ok)this.disabled=false;}catch(e){result.textContent='网络连接失败，请稍后重试';this.disabled=false;}};
</script></body></html>
