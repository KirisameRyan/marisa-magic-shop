# Include INSIDE your server block, before the existing generic PHP location.
# Apache .htaccess is ignored by Nginx: install these rules explicitly.
location ~ ^/api/bot(?:_token)?\.php$ { return 410; }
location ~ (^|/)\.(?!well-known/) { return 403; }
location ~ ^/(apps|packages|services|scripts|docs|deploy|artifacts|var|_local|proxy_cache_dir|toy-build|android-app)(/|$) { return 403; }
location ~ ^/api/(.*-config(\.example|\.local)?|bootstrap|auth-lib|smtp|llm-settings)\.php$ { return 403; }
location ~* \.(db|sqlite|sqlite3|db-wal|db-shm|env|log|bak|zip|apk|aab|jks|keystore|alf)$ { return 403; }
location = /data/waifu-db-zh.js { try_files $uri =404; }
location = /data/waifu-db-zh.json { try_files $uri =404; }
location = /data/waifu-tags.json { try_files $uri =404; }
location ~ ^/data/cache/posters/[a-zA-Z0-9_-]+\.png$ { try_files $uri =404; }
location /data/ { return 403; }
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
autoindex off;
