name: marisa-wiki

services:
  wiki:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WIKI_PORT:-8099}:80"
    environment:
      WIKI_SERVER: "${WIKI_SERVER:-http://127.0.0.1:${WIKI_PORT:-8099}}"
    volumes:
      - wiki-state:/var/lib/mediawiki
      - ./bootstrap.sh:/opt/wiki/bootstrap.sh:ro
      - ./site.php:/opt/wiki/site.php:ro
      - ./wiki-theme.css:/var/www/html/resources/assets/wiki-theme.css:ro
      - ./pages:/opt/wiki/pages:ro
      - ../../images/logo.png:/var/www/html/resources/assets/shop-logo.png:ro
    command: ["sh", "/opt/wiki/bootstrap.sh"]

volumes:
  wiki-state:
