<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传送中…</title>
<style>
 * { margin:0; padding:0; box-sizing:border-box; }
 html,body { height:100%; }
 body { font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:#141414; color:#c9c2d8; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
 .wrap { text-align:center; padding:0 20px; }
 .broom { display:inline-block; font-size:40px; animation:float 1.6s ease-in-out infinite; }
 .msg { margin-top:16px; font-size:14px; letter-spacing:3px; color:#8d86a8; }
 @keyframes float { 0%,100% { transform:translateY(0) rotate(-8deg); } 50% { transform:translateY(-10px) rotate(8deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="broom">🧹</div>
  <div class="msg">正在传送中……</div>
</div>
<script src="js/catalog.js"></script>
<script>
(function() {
  var hot = (window.MMS_CATALOG && window.MMS_CATALOG.hot) || [];
  var target = hot.length ? hot[Math.floor(Math.random() * hot.length)].href : 'index.html';
  location.replace(target);
})();
</script>
</body>
</html>
