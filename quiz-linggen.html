<style>

body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--lx-bg);
  background-image: radial-gradient(ellipse at 30% 0%, rgba(240,192,96,.06), transparent 55%),

.container { max-width:520px; width:100%; }
.card { background:var(--lx-card); border:1px solid var(--lx-border); border-radius:22px; padding:30px 24px;
  position:relative; overflow:hidden; box-shadow:0 4px 32px rgba(0,0,0,.35); }
.card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px;

.badge { display:inline-block; font-size:10px; letter-spacing:3px; color:var(--lx-gold);
  border:1px solid var(--lx-gold); border-radius:20px; padding:4px 14px; margin-bottom:14px; }
h1.title { font-size:26px; font-weight:900; letter-spacing:3px; margin-bottom:6px;

.center { text-align:center; }
.muted { color:var(--lx-muted); }

/* ── 按钮 ── */
.btn { font-family:inherit; border:none; border-radius:14px; padding:14px 28px; font-size:16px; font-weight:800;
  cursor:pointer; width:100%; letter-spacing:2px; transition:all .15s; }
.btn-main { background:linear-gradient(135deg, var(--lx-gold), #d9a84a); color:#1a1520; }
.btn-main:hover { filter:brightness(1.1); }
.btn-ghost { background:transparent; border:1px solid var(--lx-border); color:var(--lx-text); font-size:13px; margin-top:12px; }
.btn-ghost:hover { border-color:var(--lx-gold); color:var(--lx-gold); }

/* ── 题目 ── */
.q-num { font-size:11px; color:var(--lx-gold); letter-spacing:2px; margin-bottom:8px; }
.q-text { font-size:17px; font-weight:700; line-height:1.6; margin-bottom:20px; }
.opt-btn { width:100%; background:transparent; border:1px solid var(--lx-border); border-radius:14px;
  padding:13px 16px; font-size:14px; color:var(--lx-text); cursor:pointer; font-family:inherit;
  text-align:left; margin-bottom:10px; transition:all .15s; display:flex; align-items:center; gap:10px; }
.opt-btn:hover { border-color:var(--lx-gold); background:rgba(240,192,96,.05); transform:translateX(3px); }
.opt-btn:active { transform:scale(.99); }
.opt-letter { width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,.05);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--lx-muted); flex-shrink:0; }
.opt-btn:hover .opt-letter { background:var(--lx-gold); color:#1a1520; }

/* ── 加载 ── */
.loading-orb { width:60px; height:60px; border-radius:50%; margin:20px auto;
  background:conic-gradient(var(--lx-gold), var(--lx-green), var(--lx-gold));
  animation:spin 1.2s linear infinite; box-shadow:0 0 30px rgba(240,192,96,.3); }
.loading-text { font-size:13px; color:var(--lx-muted); margin-top:14px; letter-spacing:2px; }

/* ── 结果 ── */
.result-root { font-size:44px; font-weight:900; letter-spacing:4px; margin:10px 0 6px; }
.result-rarity { display:inline-block; font-size:10px; letter-spacing:3px; border-radius:16px; padding:4px 14px; margin-bottom:14px; }
.rr-n { background:rgba(136,136,136,.12); color:#aaa; border:1px solid rgba(136,136,136,.4); }
.rr-r { background:rgba(72,140,255,.12); color:#6aa8ff; border:1px solid rgba(72,140,255,.4); }
.rr-sr { background:rgba(176,120,255,.12); color:#c39aff; border:1px solid rgba(176,120,255,.4); }
.rr-ssr { background:rgba(240,192,96,.12); color:var(--lx-gold); border:1px solid rgba(240,192,96,.5); }
.rr-legend { background:rgba(127,191,111,.14); color:var(--lx-green); border:1px solid rgba(127,191,111,.6); box-shadow:0 0 16px rgba(127,191,111,.25); }

.result-tip b { color:var(--lx-green); }
.stat-line { font-size:12px; color:var(--lx-muted); margin-bottom:14px; }

/* ── 板蓝根特效 ── */
.lx-fx-mask { position:fixed; inset:0; z-index:300; background:rgba(8,10,6,.88); display:none;

@keyframes lxShine { 0% { left:-100%; } 100% { left:150%; } }
.lx-card .c-ico { font-size:56px; margin-bottom:10px; }
.lx-card .c-name { font-size:17px; font-weight:900; color:var(--lx-green); letter-spacing:2px; }
.lx-card .c-legend { font-size:9px; color:var(--lx-gold); letter-spacing:3px; margin-top:8px; }
.lx-fx-hint { font-size:11px; color:var(--lx-muted); margin-top:24px; letter-spacing:2px; animation:lxFade 1s ease 1.2s both; }
@keyframes lxShake { 0%,100% { transform:translate(0,0); } 20% { transform:translate(-3px,2px); }

.lx-shake { animation:lxShake .5s ease; }
.lx-particle { position:fixed; width:6px; height:6px; border-radius:50%; z-index:301; pointer-events:none;

@keyframes lxFall { from { transform:translateY(-20px); opacity:1; } to { transform:translateY(110vh); opacity:0; } }

/* ═══════ 题目(选项为灵根加分) ═══════ */

var BANLANGEN_RATE = 0.10;   // 隐藏灵根爆率

/* ═══════ 答题状态 ═══════ */
var qi = 0;
var scores = {};

function startQuiz() {
  document.getElementById('introView').style.display = 'none';
  document.getElementById('resultView').style.display = 'none';
  document.getElementById('quizView').style.display = 'block';
  qi = 0;
  scores = {};
  trackStart('linggen_take');
  renderQ();
}

function renderQ() {
  var q = QUESTIONS[qi];
  document.getElementById('qNum').textContent = '问 ' + String(qi + 1).padStart(2, '0') + ' / ' + QUESTIONS.length;
  document.getElementById('qText').textContent = q.q;
  var html = '';
  var letters = ['甲', '乙', '丙', '丁'];
  for (var i = 0; i < q.opts.length; i++) {
    html += '<button class="opt-btn" onclick="pick(' + i + ')"><span class="opt-letter">' + letters[i] + '</span>' + q.opts[i].t + '</button>';
  }
  document.getElementById('qOpts').innerHTML = html;
}

function pick(i) {
  var q = QUESTIONS[qi];
  var s = q.opts[i].s;
  for (var k in s) scores[k] = (scores[k] || 0) + s[k];
  qi++;
  if (qi < QUESTIONS.length) { renderQ(); }
  else { showLoading(); }
}

function showLoading() {
  document.getElementById('quizView').style.display = 'none';
  document.getElementById('loadingView').style.display = 'block';
  var texts = ['灵根正在凝聚…', '天机正在推演…', '正在翻阅《灵根谱》…'];
  var ti = 0;
  var iv = setInterval(function() {
    ti++;
    document.getElementById('loadingText').textContent = texts[ti % texts.length];
  }, 700);
  setTimeout(function() {
    clearInterval(iv);
    trackFooled('linggen_fooled');
    judge();
  }, 2100);
}

/* ═══════ 判定 ═══════ */
function judge() {
  // 10% 爆率 → 隐藏灵根
  if (Math.random() < BANLANGEN_RATE) {
    showLegend();
    return;
  }
  // 常规判定: 最高分
  var best = null, bestScore = -1;
  for (var k in scores) {
    if (scores[k] > bestScore) { bestScore = scores[k]; best = k; }
  }
  showResult(ROOTS['root_' + best]);
}

/* ═══════ 板蓝根特效 ═══════ */
function showLegend() {
  document.getElementById('loadingView').style.display = 'none';
  var fx = document.getElementById('lxFx');
  fx.style.display = 'flex';
  fx.classList.remove('lx-shake');
  void fx.offsetWidth;
  fx.classList.add('lx-shake');
  // 粒子
  for (var i = 0; i < 30; i++) {
    (function(n) {
      setTimeout(function() {
        var p = document.createElement('div');
        p.className = 'lx-particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        p.style.animationDelay = (Math.random() * 0.5) + 's';
        p.style.width = p.style.height = (3 + Math.random() * 5) + 'px';
        document.body.appendChild(p);
        setTimeout(function() { p.remove(); }, 4200);
      }, n * 60);
    })(i);
  }
  fx.onclick = function() {
    fx.style.display = 'none';
    showResult(ROOTS.root_banlangen);
  };
}

/* ═══════ 结果 ═══════ */
function showResult(root) {
  document.getElementById('loadingView').style.display = 'none';
  document.getElementById('resultView').style.display = 'block';
  document.getElementById('rootName').textContent = root.icon + ' ' + root.name;
  var rr = document.getElementById('rootRarity');
  rr.textContent = root.rarityText;
  rr.className = 'result-rarity ' + RARITY_CLS[root.rarity];
  document.getElementById('rootDesc').innerHTML = root.desc;
  document.getElementById('rootTip').innerHTML = root.tip;
  bindCount('#statLine', 'linggen_take', { template: '已有 {n} 位道友测过灵根' });
}

function restart() {
  document.getElementById('resultView').style.display = 'none';
  document.getElementById('introView').style.display = 'block';
}
</script>
