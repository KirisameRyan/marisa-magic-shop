<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="css/common.css">
<script src="js/analytics.js"></script>
<script src="js/page-base.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流浪模拟器 · 霧雨魔法店</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --g-bg: #1a1520; --g-card: #241e2a; --g-card-hover: #2d2535;
  --g-gold: #f0c060; --g-gold-dim: #a08050;
  --g-purple: #b89fff;
  --g-text: #e0d8ec; --g-muted: #8a7e9a; --g-border: #3a3045;
  --g-pink: #f472b6; --g-red: #ef4444; --g-green: #6fcf97;
}
body{background:var(--g-bg);background-image:radial-gradient(ellipse at 30% 0%,rgba(176,159,255,.05) 0%,transparent 50%),radial-gradient(ellipse at 70% 100%,rgba(240,192,96,.04) 0%,transparent 50%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:64px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--g-text);user-select:none;}
body>.container{display:none}
.glass-panel{background:var(--g-card);border:1px solid var(--g-border);box-shadow:0 25px 50px -12px rgba(0,0,0,.8);position:relative;overflow:hidden}
.glass-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g-gold),var(--g-purple),var(--g-gold));z-index:1}
.gold-text{background:linear-gradient(135deg,var(--g-gold),#ffe8b0,var(--g-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.progress-bar{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s}
.hunger-fill{background:linear-gradient(90deg,#f0c060,#e8a830)}
.danger-fill{background:linear-gradient(90deg,#ef4444,#f472b6)}
.btn-game{font-family:inherit;border:none;border-radius:12px;padding:10px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;font-size:13px}
.btn-gold{background:linear-gradient(135deg,var(--g-gold),#c89a40);color:#1a1520}
.btn-gold:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;color:var(--g-muted);border:1px solid var(--g-border)}
.btn-ghost:hover{color:var(--g-gold);border-color:var(--g-gold-dim)}
.btn-outline{background:transparent;color:var(--g-muted);border:1px solid var(--g-border);border-radius:12px;padding:6px 12px;font-size:11px;font-family:inherit;cursor:pointer;transition:all .15s}
.btn-outline:hover{border-color:var(--g-gold);color:var(--g-gold)}
.btn-danger{background:rgba(244,114,182,.12);color:var(--g-pink);border:1px solid rgba(244,114,182,.2);border-radius:12px;padding:10px;font-size:12px;cursor:pointer}
@keyframes pulse-stress{0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,0)}50%{box-shadow:0 0 18px 2px rgba(244,114,182,.3)}}
.stress-pulse{animation:pulse-stress 3s infinite}
.event-card{border:2px solid var(--g-border);border-radius:18px;padding:18px;text-align:center;transition:all .3s}
.event-card.special{border-color:var(--g-gold);box-shadow:0 0 16px rgba(240,192,96,.2)}
.event-period{display:inline-block;font-size:11px;letter-spacing:2px;padding:2px 10px;border-radius:8px;margin-bottom:8px}
.modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(26,21,32,.96);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--g-card);border:1px solid var(--g-border);border-radius:24px;width:100%;max-width:28rem;box-shadow:0 16px 48px rgba(0,0,0,.5);position:relative;overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
.modal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g-gold),var(--g-purple),var(--g-gold))}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;margin:8px 0}
.stats-item{background:rgba(255,255,255,.03);padding:6px 10px;border-radius:8px;border:1px solid var(--g-border);display:flex;justify-content:space-between}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shop-item{background:var(--g-card-hover);border:1px solid var(--g-border);border-radius:12px;padding:10px;cursor:pointer;transition:all .15s;position:relative}
.shop-item:hover{border-color:var(--g-gold)}
.shop-item.bought{opacity:.3;cursor:default;pointer-events:none}
.shop-item .price{position:absolute;top:6px;right:8px;font-size:10px;color:var(--g-gold);font-weight:800}
/* 排行榜(和幸存者/赛钱危机同款) */
.lb-wrap{text-align:center;font-size:12px}
.lb-submit{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.lb-input{background:var(--g-card-hover);border:1px solid var(--g-border);border-radius:10px;padding:8px 14px;color:var(--g-text);font-size:13px;width:140px;outline:none;font-family:inherit}
.lb-input:focus{border-color:var(--g-gold)}
.lb-btn{background:linear-gradient(135deg,var(--g-gold),#c89a40);border:none;border-radius:10px;padding:8px 20px;color:#1a1520;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.lb-btn:disabled{opacity:.5;cursor:default}
.lb-btn-ghost{background:transparent;border:1px solid var(--g-border);border-radius:10px;padding:8px 16px;color:var(--g-muted);font-size:12px;cursor:pointer;font-family:inherit}
.lb-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
.lb-table th{color:var(--g-muted);font-weight:400;padding:5px 4px;border-bottom:1px solid var(--g-border)}
.lb-table td{padding:5px 4px;color:var(--g-text);border-bottom:1px solid rgba(58,48,69,.3)}
.lb-table .lb-my td{color:var(--g-gold);font-weight:700;background:rgba(240,192,96,.06)}
.lb-note,.lb-ok{font-size:12px;margin:6px 0}.lb-ok{color:var(--g-green)}
.lb-toggle{text-align:center;font-size:12px;color:var(--g-muted);cursor:pointer;padding:6px 0;transition:color .2s}
.lb-toggle:hover{color:var(--g-gold)}
.lb-table-wrap{overflow-x:auto}
</style>
</head>
<body>

<div id="shopNav"></div>
<script src="nav.js"></script>

<div id="game-container" class="hidden relative z-10 w-full max-w-md glass-panel rounded-3xl flex flex-col min-h-[700px] transition-opacity duration-500">

  <!-- 顶部栏 -->
  <div class="px-5 py-4 border-b border-[var(--g-border)] flex justify-between items-center bg-[var(--g-bg)]/50 relative z-10">
    <div>
      <h1 class="text-xl font-black italic tracking-tighter gold-text">流浪模拟器</h1>
      <div class="text-[10px] font-bold text-[var(--g-muted)] tracking-widest uppercase">Street Survival</div>
    </div>
    <div class="text-right">
      <div class="text-[10px] uppercase text-[var(--g-muted)] font-bold">Day</div>
      <div id="day-count" class="text-2xl font-mono font-bold text-[var(--g-text)] leading-none">01</div>
      <div id="hud-best" class="text-[9px] text-[var(--g-muted)] mt-0.5">HI 0天</div>
    </div>
  </div>

  <!-- 双进度条 -->
  <div class="px-5 py-3 bg-[rgba(255,255,255,.03)] space-y-2 relative z-10">
    <div>
      <div class="flex justify-between text-xs font-bold mb-1 uppercase tracking-wider">
        <span class="text-[var(--g-gold)] flex items-center gap-1">🍞 饥饿度</span>
        <span id="hunger-val" class="text-[var(--g-text)]">40%</span>
      </div>
      <div class="progress-bar"><div id="hunger-bar" class="progress-fill hunger-fill" style="width:40%"></div></div>
    </div>
    <div>
      <div class="flex justify-between text-xs font-bold mb-1 uppercase tracking-wider">
        <span class="text-[var(--g-red)] flex items-center gap-1">⚠️ 危险度</span>
        <span id="danger-val" class="text-[var(--g-text)]">0%</span>
      </div>
      <div class="progress-bar"><div id="danger-bar" class="progress-fill danger-fill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- 事件区 -->
  <div id="event-area" class="flex-1 p-5 flex flex-col relative z-10">
    <div id="period-indicator" class="text-center mb-3"></div>
    <div id="event-card" class="event-card flex-1 flex flex-col items-center justify-center gap-3"></div>
    <div id="event-actions" class="flex gap-3 mt-4"></div>
  </div>

  <!-- 底栏 -->
  <div class="px-5 py-3 border-t border-[var(--g-border)] flex gap-2 relative z-10 bg-[var(--g-bg)]/50">
    <button onclick="openShop()" class="btn-outline flex-1 flex items-center justify-center gap-1">🏪 商店</button>
    <button onclick="openInventory()" class="btn-outline flex-1 flex items-center justify-center gap-1">🎒 背包</button>
    <button id="btn-stall" onclick="useStall()" class="btn-outline hidden flex-1" style="border-color:var(--g-gold);color:var(--g-gold)">🥞 摊位</button>
    <div class="flex-1 text-center flex items-center justify-center font-mono font-bold text-[var(--g-gold)] text-lg" id="money-display">💵 8</div>
  </div>
</div>

<!-- 开场弹层 -->
<div id="intro-overlay" class="fixed inset-0 z-[110] flex items-center justify-center p-4" style="background:rgba(26,21,32,.95);backdrop-filter:blur(12px)">
  <div class="bg-[var(--g-card)] p-8 rounded-3xl max-w-sm w-full border border-[var(--g-border)] shadow-2xl text-center relative" style="overflow:hidden">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g-gold),var(--g-purple),var(--g-gold))"></div>
    <div class="text-7xl mb-4" style="filter:drop-shadow(0 0 15px rgba(240,192,96,.5))">🌃</div>
    <h1 class="text-3xl font-black text-[var(--g-text)] mb-2 tracking-tight">流浪模拟器</h1>
    <p class="text-xs font-bold text-[var(--g-muted)] tracking-widest uppercase mb-4">Street Survival</p>
    <div class="text-left text-xs text-[var(--g-text)] space-y-2 mb-6 bg-[rgba(255,255,255,.03)] p-4 rounded-xl border border-[var(--g-border)]">
      <p>你是 <b>李明</b>。来这座城市打工第三年,中介卷走押金跑路,房东换了锁。</p>
      <p>今天早上,你坐在公园长椅上,兜里还剩 <b>8 块钱</b>。</p>
    </div>
    <button onclick="startTutorial()" class="w-full py-4 font-black rounded-xl shadow-lg hover:scale-[1.02] transition-transform" style="background:linear-gradient(135deg,var(--g-gold),#c89a40);color:#1a1520">🌃 开始流浪</button>
    <p class="text-[10px] text-[var(--g-muted)] mt-3">本故事纯属虚构,请珍惜现下的温暖。</p>
    <p class="text-[10px] text-[var(--g-muted)] mt-1" style="color:var(--g-gold-dim)">夷境工作室 · 出品</p>
  </div>
</div>

<!-- 教程弹层 -->
<div id="tut-overlay" class="hidden fixed inset-0 z-[120] flex items-center justify-center p-4" style="background:rgba(26,21,32,.95);backdrop-filter:blur(12px)">
  <div class="bg-[var(--g-card)] p-6 rounded-3xl max-w-sm w-full border border-[var(--g-border)] shadow-2xl text-center relative" style="overflow:hidden">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g-gold),var(--g-purple),var(--g-gold))"></div>
    <div id="tut-icon" class="text-5xl mb-3">🕐</div>
    <h2 id="tut-title" class="text-lg font-black text-[var(--g-text)] mb-2"></h2>
    <p id="tut-desc" class="text-xs text-[var(--g-muted)] mb-6 leading-relaxed"></p>
    <div class="flex gap-2">
      <button id="tut-prev" class="btn-game btn-ghost flex-1" onclick="prevTut()">← 上一步</button>
      <button id="tut-next" class="btn-game btn-gold flex-1" onclick="nextTut()">下一步 →</button>
      <button id="tut-skip" class="btn-game btn-ghost" onclick="startGame()" style="color:var(--g-muted);border-color:var(--g-border)">跳过</button>
    </div>
    <label id="tut-skip-label" class="hidden mt-3 flex items-center justify-center gap-2 text-[10px] text-[var(--g-muted)] cursor-pointer">
      <input type="checkbox" id="tut-noshow" onchange="toggleTutSkip()"> 下次不再显示教程
    </label>
  </div>
</div>

<!-- 反馈弹层 -->
<div id="feedback-overlay" class="hidden modal-overlay">
  <div class="modal-card">
    <div class="p-6 text-center flex-shrink-0 relative z-10">
      <div id="fb-icon" class="text-6xl mb-2" style="filter:drop-shadow(0 0 12px rgba(240,192,96,.4))"></div>
      <h2 id="fb-title" class="text-2xl font-black text-[var(--g-text)] uppercase tracking-tight"></h2>
    </div>
    <div class="px-6 pb-2 flex-shrink-0 overflow-y-auto relative z-10">
      <div class="bg-[rgba(255,255,255,.03)] rounded-xl p-4 text-sm text-[var(--g-text)] leading-relaxed border border-[var(--g-border)]">
        <p id="fb-message"></p>
      </div>
      <div id="fb-stats" class="stats-row" style="display:none"></div>
    </div>
    <div class="p-6 pt-3 flex flex-col gap-3 flex-shrink-0 mt-auto relative z-10">
      <div class="flex gap-3">
        <button id="fb-primary" class="flex-1 py-3 rounded-xl font-bold transition-colors btn-gold">继续</button>
        <button id="fb-restart" class="hidden flex-1 py-3 rounded-xl font-bold transition-colors btn-danger">重新流浪</button>
      </div>
    </div>
  </div>
</div>

<!-- 商店弹层 -->
<div id="shop-overlay" class="hidden modal-overlay">
  <div class="modal-card">
    <div class="p-5 border-b border-[var(--g-border)] flex justify-between items-center relative z-10 bg-[var(--g-card)]">
      <h2 class="text-lg font-bold text-[var(--g-text)]">🏪 街头商店</h2>
      <span class="font-mono font-bold text-[var(--g-gold)]" id="shop-money">💵 15</span>
    </div>
    <div class="p-5 overflow-y-auto relative z-10" style="max-height:55vh"><div class="shop-grid" id="shop-grid"></div></div>
    <div class="p-4 border-t border-[var(--g-border)] flex justify-center relative z-10"><button onclick="closeShop()" class="btn-outline w-40">关 闭</button></div>
  </div>
</div>

<!-- 背包弹层 -->
<div id="inv-overlay" class="hidden modal-overlay">
  <div class="modal-card">
    <div class="p-5 border-b border-[var(--g-border)] relative z-10"><h2 class="text-lg font-bold text-[var(--g-text)]">🎒 我的背包</h2></div>
    <div class="p-5 overflow-y-auto relative z-10" style="max-height:50vh"><div id="inv-list" class="space-y-2 text-sm"></div></div>
    <div class="p-4 border-t border-[var(--g-border)] flex justify-center relative z-10"><button onclick="closeInv()" class="btn-outline w-40">关 闭</button></div>
  </div>
</div>

<script>
// ═══ 状态 ═══
var S = { hunger:40, danger:0, money:8, day:1, period:0, events:[], items:[], passiveItems:[], alive:true, won:false, defend:0,
  flags:{}, skills:{work:0,beg:0,scav:0}, winMoney:1000, rerolls:0, peakMoney:8, totalEarned:0, specialsSeen:{} };

// ═══ 三个时段的事件池 ═══
var POOLS = {
  morning: [
    {t:'打零工',i:'🔨',h:-6,d:3,m:16,w:'去工地搬了半天砖。',skill:'work'},
    {t:'捡废品卖',i:'♻️',h:-2,d:1,m:8,w:'捡了些瓶子卖了点零钱。',skill:'scav'},
    {t:'救济站领粥',i:'🍲',h:-14,d:2,m:0,w:'排了半小时队领到一碗粥。'},
    {t:'路口乞讨',i:'🤲',h:-2,d:2,m:6,w:'站了一上午,好心人扔了几块钱。',skill:'beg'},
    {t:'翻菜市场',i:'🥬',h:-3,d:3,m:0,w:'拣了些摊贩丢掉的剩菜叶子。',skill:'scav'},
    {t:'帮人搬货',i:'💪',h:-7,d:6,m:15,w:'家具店卸了半天货,腰快断了。',skill:'work'},
    {t:'扫公厕',i:'🧹',h:-4,d:1,m:10,w:'忍着味道干完了。',skill:'work'},
    {t:'补个觉',i:'🛌',h:5,d:-10,m:0,w:'多睡了一会儿,精神好了不少。'}
  ],
  afternoon: [
    {t:'翻垃圾桶',i:'🗑️',h:-3,d:4,m:0,w:'翻到几个空瓶和一些剩饭。',skill:'scav'},
    {t:'地铁站蹭空调',i:'🚇',h:1,d:-4,m:0,w:'在站里待了一下午,凉快又安全。'},
    {t:'帮餐馆洗碗',i:'🍽️',h:-5,d:5,m:15,w:'洗了三小时的碗,老板给了饭。',skill:'work'},
    {t:'派传单',i:'📄',h:-4,d:2,m:10,w:'在街口站了一下午发传单。',skill:'work'},
    {t:'超市试吃',i:'🛒',h:-6,d:3,m:0,w:'挨个试吃摊蹭了一圈。'},
    {t:'街头卖艺',i:'🎤',h:-3,d:8,m:12,w:'唱了几首歌,路人扔了些零钱。',skill:'beg'},
    {t:'排队领救济金',i:'💼',h:-2,d:2,m:20,w:'排了两小时的队。'},
    {t:'阴凉处乘凉',i:'🧊',h:2,d:-3,m:0,w:'找了个树荫躺了一下午。'}
  ],
  evening: [
    {t:'公园长椅过夜',i:'🪑',h:3,d:8,m:0,w:'硬邦邦的木板,天亮还来了一群晨跑的人。'},
    {t:'ATM机房过夜',i:'🏧',h:2,d:-5,m:0,w:'玻璃门挡风,但保安凌晨来赶人了。'},
    {t:'废弃工地下榻',i:'🏚️',h:2,d:3,m:0,w:'破旧但勉强能挡风。'},
    {t:'蹭夜宵摊剩饭',i:'🍕',h:-6,d:5,m:0,w:'老板快收摊时把剩下的给了你。',skill:'scav'},
    {t:'接临时夜班',i:'🌙',h:-10,d:15,m:25,w:'深夜工厂卸货,累但钱多。',skill:'work'},
    {t:'网吧包夜',i:'💻',h:1,d:-3,m:-8,w:'八块钱待到天亮,还有热水。'},
    {t:'生火取暖',i:'🔥',h:1,d:-8,m:0,w:'捡了些干柴,火光让人安心。'},
    {t:'彻夜赶路',i:'🚶',h:8,d:4,m:0,w:'走了一整夜,想找到更好的落脚点。'}
  ]
};

var SPECIALS = {
  morning: [
    {t:'捡到钱包!',i:'🍀',h:0,d:1,m:35,w:'在地上发现一个钱包,里面有几十块钱。'},
    {t:'好心人请吃饭',i:'🙏',h:-22,d:1,m:8,w:'一位老人看你可怜,请你吃了一顿热饭,还给了车费。'},
    {t:'找到日结工',i:'📰',h:-5,d:3,m:25,w:'工头来招人,去工地搬了一天,现金当场结账。',skill:'work'}
  ],
  afternoon: [
    {t:'遇到老乡!',i:'🤝',h:-5,d:2,m:30,w:'在街上碰到一个老乡,他请你吃了顿饭还塞了些钱。',chain:'metLaoxiang'},
    {t:'捡到旧手机',i:'📱',h:0,d:1,m:0,w:'地上捡到一部还能用的旧手机。',giveItem:'phone'},
    {t:'警察查身份证',i:'🚔',h:0,d:28,m:-10,w:'警察查到你在此处逗留,以扰乱秩序为由罚了款。',locked:true}
  ],
  evening: [
    {t:'暴雨无处躲!',i:'⛈️',h:0,d:32,m:0,w:'突然下起暴雨,浑身湿透,冷得发抖。',isRain:true,locked:true},
    {t:'发现空置房!',i:'🏠',h:2,d:-100,m:0,w:'在旧城区发现一间废弃但完整的空屋,今晚安全了。',dangerClr:true},
    {t:'好心大妈给棉被',i:'👵',h:-3,d:-5,m:5,w:'一位大妈从家里拿了一床旧棉被给你。',giveItem:'blanket'},
    {t:'卷入街头纠纷',i:'🚨',h:0,d:22,m:-5,w:'两个混混在你旁边打架,钱被顺走了。',locked:true}
  ]
};

function useStall(){
  if(!S.flags.stallUnlocked) return;
  if(S._stallUsed) return;  // 每天限一次
  S.hunger=Math.min(100,S.hunger+10);

function tryEncounter(){
  if(Math.random()<0.25){
    var e=ENCOUNTERS[Math.floor(Math.random()*ENCOUNTERS.length)];
    showEncounter(e); return true;
  }
  return false;
}
function showEncounter(enc){
  var el=document.getElementById('feedback-overlay');
  clearLbArea();
  el.classList.remove('hidden');
  $('fb-icon').textContent=enc.icon;$('fb-title').textContent='⚡ '+enc.title;$('fb-title').style.color='var(--g-gold)';
  var msg='<div style="line-height:1.8;margin-bottom:12px">'+esc(enc.desc)+'</div><div style="display:flex;flex-direction:column;gap:6px">';
  for(var i=0;i<enc.options.length;i++){msg+='<button id="enc-opt-'+i+'" class="btn-game btn-ghost" style="text-align:left;font-size:13px">'+enc.options[i].label+'</button>'}
  msg+='</div>';
  $('fb-message').innerHTML=msg;document.getElementById('fb-stats').style.display='none';
  $('fb-primary').classList.add('hidden');$('fb-restart').classList.add('hidden');
  for(var i=0;i<enc.options.length;i++){document.getElementById('enc-opt-'+i).onclick=(function(idx){return function(){resolveEncounter(enc,idx)}})(i)}
}
function resolveEncounter(enc,optIdx){
  var outcomes=enc.options[optIdx].outcomes;
  var totalP=0;for(var i=0;i<outcomes.length;i++)totalP+=outcomes[i].p;
  var roll=Math.random()*totalP,acc=0,chosen=outcomes[0];
  for(var i=0;i<outcomes.length;i++){acc+=outcomes[i].p;if(roll<acc){chosen=outcomes[i];break}}
  if(chosen.flag) S.flags[chosen.flag]=1;
  S.hunger=Math.min(100,Math.max(0,S.hunger+chosen.h));
  S.danger=Math.min(100,Math.max(0,S.danger+chosen.d));
  if(S.defend&&chosen.d>8){S.danger=Math.max(0,S.danger-chosen.d+2);S.defend=0;chosen.msg+=' (🛡️ 防身棍挡了一击)'}
  S.money=Math.max(0,S.money+chosen.m);
  var deltas=[];
  if(chosen.h!==0)deltas.push('🍞 '+(chosen.h>0?'+'+chosen.h:chosen.h));
  if(chosen.d!==0)deltas.push('⚠️ '+(chosen.d>0?'+'+chosen.d:chosen.d));
  if(chosen.m!==0)deltas.push('💰 '+(chosen.m>0?'+'+chosen.m:chosen.m));
  $('fb-icon').textContent='⚡';$('fb-title').textContent='遭遇结果';$('fb-title').style.color='var(--g-text)';
  $('fb-message').innerHTML='<div style="line-height:1.8;margin-bottom:6px">'+chosen.msg+'</div>'+
    (deltas.length?'<div style="font-size:12px;color:var(--g-muted)">'+deltas.join(' &nbsp; ')+'</div>':'')+
    '<div style="margin-top:8px;font-size:12px;color:var(--g-muted)">🍞 '+S.hunger+'% &nbsp; ⚠️ '+S.danger+'% &nbsp; 💵 '+S.money+'元</div>';
  $('fb-primary').classList.remove('hidden');$('fb-primary').textContent='继续';$('fb-restart').classList.add('hidden');
  var el=document.getElementById('feedback-overlay');
  $('fb-primary').onclick=function(){el.classList.add('hidden');
    if(S.hunger>=100){die('hunger');return}if(S.danger>=100){die('danger');return}if(!S.endless&&S.money>=1000){milestone1000();return}
    nextPeriod();};
  hud();
}

function pickEvent(pool,specials){

    S.specialsSeen[s.t]=1;   // 成就:记录见过的特殊事件

function injectChainEvents(){
  if(S.endless) return;   // 无尽模式不再出现结局类事件
  // 老乡线:第5~8天,已相遇 → 电话邀约面试
  if(S.flags.metLaoxiang && !S.flags.jobUnlocked && S.day>=5 && S.day<=8 && Math.random()<0.5){
    S.events[0]={t:'老乡的电话',i:'📞',h:0,d:0,m:0,w:'',special:true,chainEvent:'laoxiang_call'};
  }
  // 记者线:坦然面对记者且结果好 → 第6天报道刊出
  if(S.flags.reporterGood && !S.flags.reportOut && S.day>=6){
    S.events[1]={t:'报道刊出了',i:'📰',h:0,d:-5,m:50,w:'那篇报道引起了很多关注,好心人给你捐了款。',special:true,chainEvent:'report_out'};
  }
  // 记者线:第12天 → 慈善机构
  if(S.flags.reportOut && !S.flags.charityMet && S.day>=12){
    S.events[1]={t:'慈善机构的人',i:'🤝',h:0,d:0,m:0,w:'',special:true,chainEvent:'charity'};
  }
  // 大叔线:第7天起,早上池概率出「帮大叔摆摊」
  if(S.day>=7 && Math.random()<0.35){
    S.events[0]={t:'帮大叔摆摊',i:'🥞',h:-8,d:2,m:25,w:'凌晨帮煎饼大叔支摊、看火,收工后他塞给你一份加蛋煎饼。',skill:'work',uncleHelp:true};
  }
  // 大叔线:第12天,大叔生病
  if(S.day>=12 && !S.flags.uncleSick && Math.random()<0.4){
    S.flags.uncleSick=1;
    S.events[0]={t:'大叔病了',i:'🤒',h:-10,d:3,m:40,w:'大叔发烧了,你替他看了一整天摊。他把当天的收入都给了你。',special:true,skill:'work'};
  }
  // 大叔线闭环:帮满3次+第10天 → 转让提议
  if((S.flags.uncleHelp||0)>=3 && S.day>=10 && !S.flags.stallOffered && !S.flags.stallDone){
    S.events[0]={t:'大叔的提议',i:'🥞',h:0,d:0,m:0,w:'',special:true,chainEvent:'stall_offer'};
  }
  // 家人线:第18天起,40% 概率
  if(S.day>=18 && !S.flags.familyMet && Math.random()<0.4){
    S.events[0]={t:'一个熟悉的身影',i:'👨‍👦',h:0,d:0,m:0,w:'',special:true,chainEvent:'family'};
  }
}

  } else {

    acts.innerHTML+='<button onclick="rerollEvent()" class="btn-game btn-ghost flex-1">🔄 上别处看看<br><span style="font-size:10px;opacity:.6">🍞+'+hC+' ⚠️+'+dC+'</span></button>';

function rerollEvent(){
  var e=S.events[S.period];
  if(e.locked) return;   // 强制事件无法逃避
  // 递增惩罚:换地方既要体力(饥饿),也增加了暴露(危险)
  var hCost=8+S.rerolls*4, dCost=3+S.rerolls*2;
  S.rerolls++;
  S.hunger=Math.min(100,S.hunger+hCost);
  S.danger=Math.min(100,S.danger+dCost);
  var p=S.period;
  var pool=p===0?POOLS.morning:p===1?POOLS.afternoon:POOLS.evening;
  var spec=p===0?SPECIALS.morning:p===1?SPECIALS.afternoon:SPECIALS.evening;
  S.events[p]=pickEvent(pool,spec);
  if(S.hunger>=100){ die('hunger'); return; }
  if(S.danger>=100){ die('danger'); return; }
  hud(); renderCurrentPeriod();
}

function acceptEvent(){
  var e=S.events[S.period];
  if(!e) return;
  // 链式剧情事件走专属流程
  if(e.chainEvent && handleChainEvent(e)) return;
  var mGain=e.m;
  if(e.skill && mGain>0) mGain+=skillBonus(e.skill);   // 熟练度收入加成
  S.hunger=Math.min(100,Math.max(0,S.hunger+e.h));
  S.danger=Math.min(100,Math.max(0,S.danger+e.d));
  if(e.dangerClr) S.danger=0;
  // 暴雨处理:冲锋衣减半,一次性雨衣自动消耗+抵消
  if(e.isRain){
    if(S.passiveItems.indexOf('jacket')>=0) e.d=Math.ceil(e.d/2);
    for(var ri=0;ri<S.items.length;ri++) if(S.items[ri].id==='raincoat'){S.items.splice(ri,1);e.d=Math.max(0,e.d-25);break}
  }
  S.money=Math.max(0,S.money+mGain);
  if(mGain>0){ S.totalEarned+=mGain; if(S.money>S.peakMoney)S.peakMoney=S.money; }
  // 熟练度经验
  var lvMsg=e.skill?gainSkill(e.skill):'';
  // 特殊事件给道具
  if(e.giveItem){
    if(e.giveItem==='blanket'){
      if(!S.flags.blanketGiven){
        S.flags.blanketGiven=true; S.passiveItems.push('blanket');
        showFeedback('🧣 获得道具','大妈把一床<b>厚棉被</b>塞到你怀里,说什么也不肯收回去。',e.i,true); return;
      } else {
        S.hunger=Math.max(0,S.hunger-10); S.money+=5;
        showFeedback('👵 大妈的包子','大妈还记得你,硬塞给你两个热包子和五块钱。',e.i,true); return;
      }
    }
    if(e.giveItem==='phone'){S.items.push({id:'phone',t:'旧手机',e:'📱',use:function(h){h.money+=25;h.danger-=5}});showFeedback('📱 获得道具','你捡到一部<b>旧手机</b>。可以在背包里使用(换钱)或留着。',e.i,true);return}
  }
  // 故事链:老乡相遇立 flag
  if(e.chain){ S.flags[e.chain]=1; }
  // 大叔帮工计数
  if(e.uncleHelp){ S.flags.uncleHelp=(S.flags.uncleHelp||0)+1; }
  if(S.hunger>=100){ die('hunger'); return; }
  if(S.danger>=100){ die('danger'); return; }
  if(!S.endless && S.money>=1000){ milestone1000(); return; }
  var extra='';
  if(lvMsg) extra='<br><span style="color:var(--g-gold);font-size:11px">'+lvMsg+'</span>';
  if(e.skill&&mGain>e.m) extra+='<br><span style="color:var(--g-green);font-size:10px">📈 熟练度加成 +'+(mGain-e.m)+' 元</span>';
  showFeedback('✅ 事件完成',e.w+extra+(e.special?'<br><span style="color:var(--g-gold);font-size:10px">✨ 稀有遭遇</span>':''),e.i,true);
}

function nextPeriod(){
  S.period++;
  if(S.period>=3){ nightSummary(); return; }
  if(!tryEncounter()) renderCurrentPeriod();
}

function nightSummary(){
  // 被动道具
  var msgs=[];
  for(var i=0;i<S.passiveItems.length;i++){
    var pi=S.passiveItems[i];
    if(pi==='blanket'){S.danger=Math.max(0,S.danger-2);msgs.push('🛏️ 棉被:危险-2')}
    if(pi==='bag'){S.hunger=Math.max(0,S.hunger-1);msgs.push('🎒 旧书包:省力,饥饿-1')}
  }
  // 手机卡被动(检查 shop item)
  if(S.passiveItems.indexOf('phone')>=0){S.money+=8;msgs.push('📱 旧手机自动接单: +8元')}
  // 每日自然消耗
  S.hunger=Math.min(100,S.hunger+6);
  var dDanger=3+Math.floor(Math.random()*3);
  if(S.endless) dDanger+=1+Math.floor(S.day/10);   // 无尽模式难度爬坡
  S.danger=Math.min(100,S.danger+dDanger);
  // 持续性 buff
  if(S.charityBuff) S.money+=S.charityBuff;
  if(S.jobBuff) S.money+=S.jobBuff;
  // 每日自然消耗
  msgs.push('🌃 过夜:饥饿+6,危险+'+dDanger);
  if(S.charityBuff||S.jobBuff) msgs.push('💰 今日补贴:'+(S.charityBuff||0)+(S.jobBuff||0)+'元');
  // 日记一句话
  var diary='又活了一天。';
  if(S._lottery) diary='花了 5 块赌一个梦。明天开奖见。';
  else if(S._encountered) diary='差点出大事。以后那条巷子得绕着走。';
  else if(S._worked) diary='今天又干了一天活。胳膊酸,但心里踏实。';
  else if(S._begged) diary='在街上举了一天纸牌。有个小孩把零花钱扔进了我的杯子。';
  else if(S._scaved) diary='在垃圾桶里翻到了还能吃的。第'+S.day+'天了,早就不觉得丢脸了。';
  msgs.push('<br><span style="color:var(--g-gold-dim);font-style:italic;font-size:11px">📝 '+diary+'</span>');
  S._worked=S._begged=S._scaved=S._encountered=S._lottery=false;
  // 剧情里程碑
  var milestones = {'3':'三天了。你开始分得清哪些垃圾桶每周几有人扔剩饭。','7':'一周了。路口卖煎饼的大叔开始对你点头。有人说这叫"混熟了"。','10':'第十天。你注意到路过的警车比刚来那会儿多了。也许只是错觉。','15':'十五天了。你甚至有了自己偏好的长椅——朝南那排,第三张。'};
  if(milestones[S.day]) msgs.push('<br><span style="color:var(--g-gold-dim);font-style:italic;font-size:12px">'+milestones[S.day]+'</span>');
  if(S.hunger>=100){ die('hunger'); return; }
  if(S.danger>=100){ die('danger'); return; }
  if(!S.endless && S.money>=1000){ milestone1000(); return; }
  checkAchievements();
  // 夜间总结弹层
  var el=document.getElementById('feedback-overlay');
  clearLbArea();
  el.classList.remove('hidden');
  $('fb-icon').textContent='🌙';
  $('fb-title').textContent='第 '+S.day+' 天结束';
  $('fb-title').style.color='var(--g-text)';
  $('fb-message').innerHTML='<div style="line-height:2">'+msgs.map(function(m){return '<div>'+m+'</div>'}).join('')+'</div><div style="margin-top:10px;font-size:12px;color:var(--g-muted)">🍞 饥饿 '+S.hunger+'% &nbsp; ⚠️ 危险 '+S.danger+'% &nbsp; 💵 '+S.money+'元</div>';
  document.getElementById('fb-stats').style.display='none';
  $('fb-primary').classList.remove('hidden');$('fb-primary').textContent='进入下一天';
  $('fb-restart').classList.add('hidden');
  $('fb-primary').onclick=function(){el.classList.add('hidden');S.day++;hud();startDay()};
}

function clearLbArea(){var o=document.querySelector('#feedback-overlay .lb-area');if(o)o.remove();}
function showFeedback(title,msg,icon,isContinue){
  var el=document.getElementById('feedback-overlay');
  clearLbArea();
  el.classList.remove('hidden');
  $('fb-icon').textContent=icon;$('fb-title').textContent=title;$('fb-title').style.color='var(--g-text)';
  $('fb-message').innerHTML=msg+'<div style="margin-top:8px;font-size:12px;color:var(--g-muted)">🍞 饥饿 '+S.hunger+'% &nbsp; ⚠️ 危险 '+S.danger+'% &nbsp; 💵 '+S.money+'元</div>';
  document.getElementById('fb-stats').style.display='none';
  $('fb-primary').classList.remove('hidden');$('fb-primary').textContent='继续';
  $('fb-restart').classList.add('hidden');
  if(isContinue){$('fb-primary').onclick=function(){el.classList.add('hidden');nextPeriod()}}
  else{$('fb-primary').onclick=function(){el.classList.add('hidden')}}
}

function die(cause){
  S.alive=false;
  var el=document.getElementById('feedback-overlay');
  clearLbArea();
  el.classList.remove('hidden');
  $('fb-title').style.color='var(--g-pink)';
  if(cause==='family'){$('fb-icon').textContent='🚂';$('fb-title').textContent='选择回家'}
  else if(cause==='hunger'){$('fb-icon').textContent='🍞';$('fb-title').textContent='饿死街头'}else{$('fb-icon').textContent='☠️';$('fb-title').textContent='灾祸降临'}
  $('fb-message').innerHTML=(cause==='family'?'火车开动了。你看着窗外,这座吞噬过你的城市慢慢后退。你不知道什么时候还会回来。':(cause==='hunger'?'连最后一口气也耗尽了。这座城市的角落里,又多了一具沉默的尸体。':'被命运击倒了。这座城市不会为任何人停下脚步。'))+
    '<div style="margin-top:12px;padding:10px;background:rgba(239,68,68,.08);border-radius:10px;border:1px solid rgba(239,68,68,.2)"><div class="stats-row" style="display:grid">'+
    '<div class="stats-item"><span>存活天数</span><b style="color:var(--g-text)">'+S.day+'</b></div>'+
    '<div class="stats-item"><span>累计收入</span><b style="color:var(--g-gold)">'+S.money+'</b></div>'+
    '<div class="stats-item"><span>道具数量</span><b>'+S.passiveItems.length+'</b></div>'+
    '<div class="stats-item"><span>饥饿/危险</span><b>'+S.hunger+'%/'+S.danger+'%</b></div>'+
    '</div></div>';
  checkAchievements();
  $('fb-message').innerHTML+=achBadgesHTML()+'<div style="margin-top:10px;font-size:10px;color:var(--g-muted);text-align:center">夷境工作室 · 出品</div>';
  document.getElementById('fb-stats').style.display='none';
  $('fb-primary').classList.add('hidden');
  $('fb-restart').classList.remove('hidden');
  $('fb-restart').onclick=function(){el.classList.add('hidden');startGame()};
  saveBest();
  // 排行榜:无尽模式上无尽榜,普通模式上普通榜
  var lbDiv=document.createElement('div');lbDiv.style.cssText='margin-top:12px';
  $('fb-message').parentNode.parentNode.insertBefore(lbDiv,$('fb-message').parentNode.nextSibling);
  loadLB(lbDiv, S.endless ? lbCfgEndless() : lbCfgNormal());
}

function win(){}  // 已废弃:1000元进入里程碑,不再有胜利弹层

function useStall(){
  if(!S.flags.stallUnlocked) return;
  if(S._stallUsed) return;  // 每天限一次
  S.hunger=Math.min(100,S.hunger+10);
  S.money+=25;
  S._stallUsed=true;
  showFeedback('🥞 煎饼摊','你支了一个多小时摊,卖了几个煎饼。赚了 <b>25 元</b>,但站这么久有点饿了。','🪙',true);
}
// ═══ 商店 ═══
function openShop(){
  $('shop-money').textContent='💵 '+S.money;
  var g=$('shop-grid');g.innerHTML='';
  for(var i=0;i<SHOP.length;i++){
    var it=SHOP[i];
    var owned=it.passive!==undefined && S.passiveItems.indexOf(it.id)>=0;
    var canBuy=!owned && S.money>=it.c;
    var cls='shop-item'+((canBuy)?'':' bought');
    var badge=owned?'<div class="price" style="color:var(--g-green)">✅ 已拥有</div>':'<div class="price">¥'+it.c+'</div>';
    g.innerHTML+='<div class="'+cls+'" onclick="buyItem(\''+it.id+'\')"><div class="text-2xl">'+it.e+'</div><div class="text-xs font-bold mt-1">'+it.t+'</div><div class="text-[10px] text-[var(--g-muted)]">'+it.desc+'</div>'+badge+'</div>';
  }
  $('shop-overlay').classList.remove('hidden');
}
function closeShop(){$('shop-overlay').classList.add('hidden')}
function buyItem(id){
  var it=null;for(var i=0;i<SHOP.length;i++)if(SHOP[i].id===id){it=SHOP[i];break}
  if(!it||S.money<it.c)return;
  if(it.passive!==undefined && S.passiveItems.indexOf(id)>=0) return;   // 常驻道具唯一
  S.money-=it.c;
  if(it.passive!==undefined){ S.passiveItems.push(id); }
  else{ S.items.push({id:it.id,t:it.t,e:it.e,use:it.use}); }
  hud(); openShop();
}

// ═══ 背包 ═══
function openInventory(){
  var l=$('inv-list');l.innerHTML='';
  // 熟练度
  l.innerHTML+='<div style="font-size:11px;color:var(--g-gold);margin-bottom:4px">📈 技能熟练度</div>';
  var sk=[['work','打工'],['beg','乞讨'],['scav','拾荒']];
  for(var si=0;si<sk.length;si++){
    var k=sk[si][0],nm=sk[si][1],lv=skillLv(k),xp=S.skills[k]%3;
    var pips='';for(var pi=0;pi<3;pi++)pips+=pi<xp?'●':'○';
    l.innerHTML+='<div style="padding:6px 10px;background:rgba(240,192,96,.05);border:1px solid rgba(240,192,96,.12);border-radius:10px;font-size:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span>💪 '+nm+'熟练 <b style="color:var(--g-gold)">Lv '+lv+'</b> <span style="font-size:10px;color:var(--g-muted)">'+pips+'</span></span><span style="font-size:10px;color:var(--g-green)">收入+'+(lv*2)+'</span></div>';
  }
  // 永久道具
  if(S.passiveItems.length>0){
    l.innerHTML+='<div style="font-size:11px;color:var(--g-gold);margin-bottom:4px">🛡️ 生效中的永久道具</div>';
    for(var i=0;i<S.passiveItems.length;i++){
      var pid=S.passiveItems[i];var shop=null;
      for(var j=0;j<SHOP.length;j++)if(SHOP[j].id===pid){shop=SHOP[j];break}
      l.innerHTML+='<div style="padding:6px 10px;background:rgba(240,192,96,.06);border:1px solid rgba(240,192,96,.15);border-radius:10px;font-size:12px">'+shop.e+' <b>'+shop.t+'</b> <span style="color:var(--g-green)">生效中</span></div>';
    }
  }
  // 一次性道具
  if(S.items.length>0){
    l.innerHTML+='<div style="font-size:11px;color:var(--g-muted);margin:8px 0 4px">📦 可使用的道具</div>';
    for(var i=0;i<S.items.length;i++){
      var it=S.items[i]; (function(idx){
        l.innerHTML+='<div style="padding:8px 12px;background:var(--g-card-hover);border:1px solid var(--g-border);border-radius:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="useItem('+idx+')"><span>'+it.e+' <b>'+it.t+'</b></span><span style="font-size:10px;color:var(--g-gold)">使用 →</span></div>';
      })(i);
    }
  }
  if(!S.passiveItems.length&&!S.items.length) l.innerHTML+='<div style="color:var(--g-muted);text-align:center;padding:12px;font-size:12px">身上还没有任何道具</div>';
  $('inv-overlay').classList.remove('hidden');
}
function closeInv(){$('inv-overlay').classList.add('hidden')}
function useItem(idx){
  var it=S.items[idx];if(!it)return;
  it.use(S); S.items.splice(idx,1);
  // 数值夹紧,防止道具把状态扣成负数
  S.hunger=Math.min(100,Math.max(0,S.hunger));
  S.danger=Math.min(100,Math.max(0,S.danger));
  S.money=Math.max(0,S.money);
  hud(); openInventory();
}
</script>
