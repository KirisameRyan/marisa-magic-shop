function calcResult(answers) {
  var scores = {};
  var types = ['onee','furry','oppai','osana','yandere','uniform','pure'];
  for (var t = 0; t < types.length; t++) scores[types[t]] = 0;
  for (var i = 0; i < answers.length; i++) {
    var w = (i >= 8) ? 2 : 1;
    var s = answers[i].scores || {};
    for (var k in s) {
      if (s[k] > 0) scores[k] = (scores[k] || 0) + s[k] * w;
    }
  }
  var top = 'regular', best = 0;
  for (var k in scores) {
    if (scores[k] > best) { best = scores[k]; top = k; }
  }
  if (best < 10) top = 'regular';
  return { key: top, isTrap: top !== 'regular', scores: scores };
}
